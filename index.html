      <div class="share-host"></div>
      <div class="reader-tour" hidden tabindex="-1" role="dialog" aria-modal="true" aria-label="Quick Read guide">
        <div class="reader-tour-step" data-tour-step="1">
          <div class="reader-tour-card reader-tour-toolbar-card"><p>Change content category by tapping the category name on this toolbar.</p><p>You can also change language and adjust summary style.</p><button class="reader-tour-action" type="button" data-tour-next>Next</button></div>
        </div>
        <div class="reader-tour-step" data-tour-step="2" hidden>
          <div class="reader-tour-card reader-tour-bookmark-card">Double tap the article or use the Bookmark button to bookmark it.</div>
          <div class="reader-tour-card reader-tour-bookmark-action"><p>Or use the bookmark button on the toolbar.</p><p>If you find the article interesting, you can share it using the Share button.</p><button class="reader-tour-action" type="button" data-tour-done>Got it</button></div>
        </div>
      </div>
      <div class="welcome-overlay" hidden tabindex="-1" role="dialog" aria-modal="true" aria-label="Choose your Quick Digest reading style">
        <button class="welcome-close" data-back-home aria-label="Close Quick Digest"><img src="${ASSETS.iconClose}" alt=""></button>
        ${renderWelcomeContent()}
      </div>
    `;

        const welcomeOverlay = screenEl.querySelector(".welcome-overlay");
        let welcomeClosing = false;
        function setWelcomeVisible(visible) {
          welcomeClosing = false;
          welcomeOverlay.style.transition = "none";
          welcomeOverlay.style.transform = "translateY(0)";
          welcomeOverlay.hidden = !visible;
          Array.from(screenEl.children).forEach((child) => {
            if (child !== welcomeOverlay) child.inert = visible;
          });
          if (visible) welcomeOverlay.focus({ preventScroll: true });
          else screenEl.querySelector("[data-close]").focus({ preventScroll: true });
        }
        function enterDigest() {
          if (welcomeOverlay.hidden || welcomeClosing) return;
          welcomeClosing = true;
          welcomeOverlay.style.transition = "transform .38s cubic-bezier(.32,0,.15,1)";
          welcomeOverlay.style.transform = "translateY(-100%)";
          setTimeout(() => {
            setWelcomeVisible(false);
            refreshBottombar();
            showSwipeHint();
          }, 380);
        }
        onPointerDrag(welcomeOverlay, {
          shouldStart(e) { return !e.target.closest("button"); },
          onMove(dx, dy, e) {
            if (welcomeClosing || dy >= 0 || Math.abs(dy) <= Math.abs(dx)) return;
            e.preventDefault();
            welcomeOverlay.style.transition = "none";
            welcomeOverlay.style.transform = `translateY(${dy}px)`;
          },
          onEnd(dx, dy, e) {
            if (e.type !== "pointercancel" && dy < -80 && Math.abs(dy) > Math.abs(dx)) enterDigest();
            else if (!welcomeClosing) {
              welcomeOverlay.style.transition = "transform .2s ease";
              welcomeOverlay.style.transform = "translateY(0)";
            }
          },
        });
        let welcomeWheel = 0;
        welcomeOverlay.addEventListener("wheel", (e) => {
          e.stopPropagation();
          if (e.deltaY <= 0) return;
          e.preventDefault();
          welcomeWheel += e.deltaY;
          if (welcomeWheel >= 120) { welcomeWheel = 0; enterDigest(); }
        }, { passive: false });
        welcomeOverlay.addEventListener("keydown", (e) => {
          if (e.key === "Escape") { setWelcomeVisible(false); onClose(); }
          if (["ArrowDown", "PageDown"].includes(e.key)) { e.preventDefault(); enterDigest(); }
        });

        const tabBtns = screenEl.querySelectorAll(".tab-btn");
        const tabCarets = screenEl.querySelectorAll(".tab-caret");
        const tabSlideHost = screenEl.querySelector(".tabslide-host");
        const bottomBar = screenEl.querySelector(".reader-bottombar");
        const bottombarLeft = screenEl.querySelector(".bottombar-left");
        const likeBar = screenEl.querySelector(".reader-likebar");
        const likeBtn = screenEl.querySelector("[data-like]");
        const likeLabel = likeBtn.querySelector("[data-like-label]");
        const bookmarkBtn = screenEl.querySelector("[data-bookmark]");
        const languageBtn = screenEl.querySelector("[data-language-settings]");
        const settingsBtn = screenEl.querySelector("[data-reading-settings]");
        const readingModeIndicator = settingsBtn.querySelector("[data-reading-mode-indicator]");
        const shareBtn = screenEl.querySelector("[data-share]");
        const tour = screenEl.querySelector(".reader-tour");
        const tourTrigger = screenEl.querySelector("[data-tour-trigger]");

        function setTourStep(step) {
          screenEl.dataset.tourStep = step;
          tour.querySelectorAll("[data-tour-step]").forEach((panel) => {
            panel.hidden = panel.dataset.tourStep !== String(step);
          });
        }

        function closeTour(restoreFocus = true) {
          tour.hidden = true;
          screenEl.classList.remove("reader-tour-open");
          delete screenEl.dataset.tourStep;
          if (restoreFocus) tourTrigger.focus({ preventScroll: true });
        }

        function openTour() {
          setTourStep(1);
          tour.hidden = false;
          screenEl.classList.add("reader-tour-open");
          tour.querySelector("[data-tour-next]").focus({ preventScroll: true });
        }

        const slider = createTabSlider(tabSlideHost, {});

        const vLatest = createVFeed(slider.paneLatest, {
          getPosts: feedLatest, getIndex: () => state.latestIndex,
          getReadingMode: () => screenEl.dataset.readingMode,
          setIndex: (i) => { state.latestIndex = i; refreshBottombar(); maybeShowSummaryStreak(); },
        });
        const vCurated = createVFeed(slider.paneCurated, {
          getPosts: feedCurated, getIndex: () => state.curatedIndex,
          getReadingMode: () => screenEl.dataset.readingMode,
          setIndex: (i) => { state.curatedIndex = i; refreshBottombar(); maybeShowSummaryStreak(); },
        });

        function setTab(tab, animated) {
          state.activeTab = tab;
          refreshTabUI();
          slider.setActive(tab, animated);
          refreshBottombar();
          (tab === "latest" ? vLatest : vCurated).snapCurrent();
        }

        function refreshTabUI() {
          tabBtns.forEach((btn) => {
            const active = btn.getAttribute("data-tab") === state.activeTab;
            btn.classList.toggle("active", active);
            btn.setAttribute("aria-selected", String(active));
          });
          tabCarets.forEach((c, i) => {
            const tabName = i === 0 ? "latest" : "curated";
            c.style.visibility = tabName === state.activeTab ? "visible" : "hidden";
          });
        }

        function isLikePromptPost(post) {
          return state.topicSelectionGroup === "explore" && post.tags.some((tag) => state.selectedTopics.includes(tag.l));
        }

        function refreshBottombar() {
          readingModeIndicator.textContent = READING_MODE_ICONS[screenEl.dataset.readingMode];
          screenEl.querySelectorAll(".welcome-choice").forEach((button) => {
            button.setAttribute("aria-pressed", String(button.dataset.readingMode === screenEl.dataset.readingMode));
          });
          const item = currentItem();
          screenEl.classList.toggle("showing-summary", item && item.kind === "summary");
          const isAd = item && item.kind === "ad";
          const isEvent = item && item.kind === "event";
          screenEl.classList.toggle("showing-ad", isAd);
          bottomBar.classList.toggle("content-ad", isAd);
          bottomBar.classList.toggle("event-only", isEvent);
          if (isAd || isEvent) {
            likeBar.classList.remove("show");
            likeBtn.classList.remove("show");
            if (isAd) return;
          }
          const post = currentPost();
          const liked = state.likedPosts.has(post.id);
          const showPostActions = item && item.kind === "post";
          const showLike = showPostActions;
          likeBar.classList.toggle("show", showPostActions);
          likeBtn.classList.toggle("show", showLike);
          likeBtn.setAttribute("aria-pressed", String(liked));
          likeLabel.textContent = liked ? "Liked" : "I like this content";
          const isBm = state.bookmarked.has(post.id);
          bookmarkBtn.setAttribute("aria-pressed", String(isBm));

        likeBtn.addEventListener("click", () => {

          state.likedPosts.add(post.id);

          const topic =
            post.tags.find((tag) => !state.savedTopics.includes(tag.l)) ||
            post.tags[0];

          state.likedTopics.push(topic.l);
          const likesForTopic = state.likedTopics.filter((likedTopic) => likedTopic === topic.l).length;

          if (likesForTopic === 3 && !state.savedTopics.includes(topic.l)) {
            state.savedTopics.push(topic.l);

        function rerenderFeeds() {

        function maybeShowSummaryStreak() {
          if (summaryStreakShown || currentItem().kind !== "summary") return;

          const streak = recordSummaryVisit();
          const pane = state.activeTab === "latest" ? slider.paneLatest : slider.paneCurated;
          const toast = pane.querySelector("[data-summary-streak]");

          toast.querySelector(".summary-streak-days").innerHTML = streakDayStrip(streak.count);
          toast.querySelectorAll(".summary-streak-day").forEach((day) => {

          });

        function goToNextItem() {
          const feed = currentFeed();
          const idx = currentIndex();
          const nextIdx = Math.min(idx + 1, feed.length - 1);
          if (nextIdx === idx) return;
          if (state.activeTab === "latest") state.latestIndex = nextIdx; else state.curatedIndex = nextIdx;

        function appendTopicPosts(tab, topics) {
          const groups = topics.map((topic) => {
            let group = state.extended[tab].find((g) => g.topic === topic);
            if (!group) {
              group = { topic, items: topicDemoPosts(topic) };
              state.extended[tab].push(group);
            }
            return group;
          });
          rerenderFeeds();
          const feed = tab === "latest" ? feedLatest() : feedCurated();
          const targetIdx = feed.indexOf(groups[0].items[0]);
          if (targetIdx === -1) return;
          if (tab === "latest") state.latestIndex = targetIdx; else state.curatedIndex = targetIdx;
          const fv = tab === "latest" ? vLatest : vCurated;
          fv.snapCurrent(true);
          fv.resetScroll(targetIdx);
          refreshBottombar();
        }

        function selectSummaryTopic(tab, topic) {
          const selected = state.summarySelections[tab];
          const index = selected.indexOf(topic);
          if (index >= 0) selected.splice(index, 1);
          else selected.push(topic);
          rerenderFeeds();
        }

        function saveSummaryTopics(tab) {
          const selected = state.summarySelections[tab].slice();
          if (!selected.length) return [];
          const newTopics = selected.filter((topic) => !state.coveredTopicLabels.includes(topic));
          state.selectedTopics = selected;
          state.moreToExploreTopics = selected;
          state.topicSelectionGroup = "explore";
          state.coveredTopicLabels = Array.from(new Set(state.coveredTopicLabels.concat(newTopics)));
          state.coveredTopicCount = state.coveredTopicLabels.length;
          state.showAllCoveredTopics = false;
          state.summaryRecs[tab] = null;
          return newTopics;
        }

        function continueSummary(tab) {
          const selected = saveSummaryTopics(tab);

            shufflePosts();

        let lastPostTap = null;
        screenEl.addEventListener("pointerup", (e) => {
          const postContent = e.target.closest(".post-content");
          if (!postContent || e.target.closest("button, a")) return;
          const post = currentPost();
          const tap = { time: Date.now(), x: e.clientX, y: e.clientY, id: post.id };
          if (lastPostTap && tap.time - lastPostTap.time < 350 && tap.id === lastPostTap.id && Math.hypot(tap.x - lastPostTap.x, tap.y - lastPostTap.y) < 24) {
            if (!canAccess()) {
              lastPostTap = null;
              onRequireLogin({ type: "bookmark", postId: post.id });
              return;

            state.bookmarked.add(post.id);
            refreshBottombar();
            showBookmarkHint();

        // Delegate feed actions so summary choices can be made before new posts are appended.

          const readingChoice = e.target.closest(".welcome-choice");
          if (readingChoice) {
            screenEl.dataset.readingMode = readingChoice.dataset.readingMode;

          if (e.target.closest("[data-enter-digest]")) { enterDigest(); return; }
          if (e.target.closest("[data-event-later]")) { goToNextItem(); return; }
          const topicCard = e.target.closest("[data-summary-topic]");
          if (topicCard) {
            e.preventDefault();
            selectSummaryTopic(state.activeTab, topicCard.getAttribute("data-summary-topic"));
            return;
          }
          if (e.target.closest("[data-summary-continue]")) { continueSummary(state.activeTab); return; }

        function activate() {

        function showCenterHint(message, icon) {
          const old = screenEl.querySelector(".swipe-hint");

          const hint = document.createElement("div");
          hint.className = "swipe-hint";
          hint.innerHTML = icon
            ? icon === "bookmark"
              ? `<img class="swipe-hint-bookmark" src="${ASSETS.iconBookmarkFull}" alt=""><span>${esc(message)}</span>`
              : `<span class="swipe-hint-arrow ${icon}">${icon === "up" ? "&#8593;" : "&#8596;"}</span><span>${esc(message)}</span>`
            : `<span>${esc(message)}</span>`;
          screenEl.appendChild(hint);
          requestAnimationFrame(() => hint.classList.add("show"));
          setTimeout(() => {
            hint.classList.remove("show");
            setTimeout(() => hint.remove(), 250);
          }, 2200);

        function showTopicSetup(onDone) {
          const topics = ["Covid19", "Health", "Artificial Intelligence", "Connected", "Inclusive", "Data & Transformation", "Resilience", "CitizenCentric", "Secure Gov"];
          const overlay = document.createElement("div");
          overlay.className = "topic-setup-overlay";
          overlay.innerHTML = `
            <div class="topic-setup-scrim" data-close></div>
            <section class="topic-setup-sheet" role="dialog" aria-modal="true" aria-labelledby="topic-setup-title">
              <h2 id="topic-setup-title" class="serif">Choose the topics that interest you most</h2>
              <p>We use this data to tailor your feed just for you.</p>
              <button class="topic-setup-select-all" type="button" data-select-all><img src="assets/figma-topic-select-all.svg" alt=""><span>Select all</span></button>
              <div class="topic-setup-options">${topics.map((topic) => `<button class="topic-setup-option" type="button" data-topic="${esc(topic)}" aria-pressed="false">${esc(topic)}</button>`).join("")}</div>
              <button class="topic-setup-save" type="button" data-save disabled>Save</button>
            </section>`;
          screenEl.appendChild(overlay);
          requestAnimationFrame(() => requestAnimationFrame(() => overlay.classList.add("show")));
          const selected = new Set();
          const save = overlay.querySelector("[data-save]");
          const options = overlay.querySelectorAll("[data-topic]");
          const close = () => overlay.remove();
          const render = () => {
            options.forEach((button) => button.setAttribute("aria-pressed", String(selected.has(button.dataset.topic))));
            save.disabled = selected.size === 0;
          };
          overlay.querySelector("[data-close]").addEventListener("click", close);
          overlay.querySelector("[data-select-all]").addEventListener("click", () => {
            topics.forEach((topic) => selected.add(topic));
            render();
          });
          options.forEach((button) => button.addEventListener("click", () => {
            const topic = button.dataset.topic;
            if (selected.has(topic)) selected.delete(topic); else selected.add(topic);
            render();
          }));
          save.addEventListener("click", () => {
            state.curatedTopics = Array.from(selected);
            state.selectedTopics = [];
            state.topicSelectionGroup = null;
            state.storyGroup = null;
            state.activeTab = "curated";

            rerenderFeeds();
            refreshTabUI();
            refreshBottombar();
            close();
            onDone();
          });
          setTimeout(() => options[0].focus({ preventScroll: true }), 600);
        }

        function showRoleSetup(flow, onDone) {
          const sectorStep = { title: "Which sector are you in?", options: ["Government and Statutory Boards", "Private Sector"] };
          const industryStep = { title: "Which industry are you working in?", options: ["Agriculture & Food", "Building, Construction, Infrastructure & Public Works", "Communications & Information", "Culture, Community, Sports & Youth", "Defence – Air, Land, Sea", "Education", "Environment, Natural Resources, Energy, Sustainability", "Healthcare", "Transport", "Other"] };
          const peerSteps = [
            { title: "You’re a...", options: ["C-level/President/Owner/Chairman/Permanent Secretary/ Deputy Secretary", "Director/GM/Head of Department", "Assistant Director/ Deputy Director", "Manager/ Specialist", "Executive/Officer", "Academia", "Other"], selected: "Assistant Director/ Deputy Director" },
            { title: "What are you responsible for?", options: ["Accounting/Finance/Procurement", "Admin/Operations/Customer Service", "Audit/Compliance/Legal", "HR/Training", "IT/Technology", "Marketing/Communications", "Policy/Planning/Strategy", "Other"] },
            sectorStep,
            industryStep,
          ];
          const steps = flow === "sector" ? [sectorStep] : flow === "industry" ? [sectorStep, industryStep] : peerSteps;
          const overlay = document.createElement("div");
          overlay.className = "role-setup-overlay";
          overlay.innerHTML = '<div class="role-setup-scrim"></div><section class="role-setup-sheet" role="dialog" aria-modal="true" aria-labelledby="role-setup-title"></section>';
          screenEl.appendChild(overlay);
          requestAnimationFrame(() => requestAnimationFrame(() => overlay.classList.add("show")));
          const sheet = overlay.querySelector(".role-setup-sheet");
          let stepIndex = 0;
          const selections = steps.map((step) => step.selected || null);
          const render = () => {
            const step = steps[stepIndex];
            sheet.innerHTML = `
              <p class="role-setup-intro">Share a few details about your role so we can personalise your selection.</p>
              <h2 id="role-setup-title" class="serif">${esc(step.title)}</h2>
              <div class="role-setup-options">${step.options.map((option) => {
                const selected = selections[stepIndex] === option;
                return `<button class="role-setup-option" type="button" data-role-option="${esc(option)}" aria-pressed="${selected}"><span>${esc(option)}</span>${selected ? '<img src="assets/figma-role-selected.svg" alt="">' : ""}</button>`;
              }).join("")}</div>
              <button class="role-setup-next" type="button" data-role-next ${selections[stepIndex] ? "" : "disabled"}>${stepIndex === steps.length - 1 ? "Done" : "Next"}</button>`;
            sheet.querySelectorAll("[data-role-option]").forEach((button) => button.addEventListener("click", () => {
              selections[stepIndex] = button.dataset.roleOption;
              render();
            }));
            sheet.querySelector("[data-role-next]").addEventListener("click", () => {
              if (!selections[stepIndex]) return;
              if (stepIndex === steps.length - 1) {
                if (flow === "peers") {
                  state.profile.jobLevel = selections[0];
                  state.profile.jobFunction = selections[1];
                  state.profile.sector = selections[2];
                  state.profile.industry = selections[3];
                } else if (flow === "sector") {
                  state.profile.sector = selections[0];
                } else if (flow === "industry") {
                  state.profile.sector = selections[0];
                  state.profile.industry = selections[1];
                }
                overlay.remove();
                onDone(selections);
                return;
              }
              stepIndex += 1;
              render();
            });
          };
          render();
        }

        function showCloseOnboarding(onDone) {
          const sectorStep = { key: "sector", title: "Which sector are you in?", options: ["Government and Statutory Boards", "Private Sector"] };
          const industryStep = { key: "industry", title: "Which industry are you working in?", options: ["Agriculture & Food", "Building, Construction, Infrastructure & Public Works", "Communications & Information", "Culture, Community, Sports & Youth", "Defence – Air, Land, Sea", "Education", "Environment, Natural Resources, Energy, Sustainability", "Healthcare", "Transport", "Other"] };
          const steps = [
            !(state.profile.firstName && state.profile.lastName) && { key: "name", title: "What can we call you?" },
            !state.profile.sector && sectorStep,
            !state.profile.industry && industryStep,
            !state.profile.jobLevel && { key: "jobLevel", title: "You’re a...", options: ["C-level/President/Owner/Chairman/Permanent Secretary/ Deputy Secretary", "Director/GM/Head of Department", "Assistant Director/ Deputy Director", "Manager/ Specialist", "Executive/Officer", "Academia", "Other"] },
            !state.profile.jobFunction && { key: "jobFunction", title: "What are you responsible for?", options: ["Accounting/Finance/Procurement", "Admin/Operations/Customer Service", "Audit/Compliance/Legal", "HR/Training", "IT/Technology", "Marketing/Communications", "Policy/Planning/Strategy", "Other"] },
          ].filter(Boolean);
          if (!steps.length) { onDone(); return; }
          const overlay = document.createElement("section");
          overlay.className = "profile-onboarding";
          overlay.setAttribute("role", "dialog");
          overlay.setAttribute("aria-modal", "true");
          screenEl.appendChild(overlay);
          let stepIndex = 0;

          const close = () => { overlay.remove(); onDone(); };
          const renderProgress = () => steps.length < 2 ? "" : `<div class="profile-onboarding-progress" aria-label="Step ${stepIndex + 1} of ${steps.length}">${steps.map((_, index) => {
            const status = index < stepIndex ? "done" : index === stepIndex ? "active" : "";
            const marker = status === "done" ? '<img src="assets/figma-onboarding-complete.svg" alt="Completed">' : "";
            const line = index < steps.length - 1 ? `<span class="profile-onboarding-progress-line ${index < stepIndex ? "done" : ""}"></span>` : "";
            return `<span class="profile-onboarding-progress-step ${status}">${marker}</span>${line}`;
          }).join("")}</div>`;
          const canAdvance = (step) => step.key === "name" ? Boolean(state.profile.firstName.trim() && state.profile.lastName.trim()) : Boolean(state.profile[step.key]);
          const render = () => {
            const step = steps[stepIndex];
            const isName = step.key === "name";
            overlay.innerHTML = `
              <div class="profile-onboarding-header">
                <div class="profile-onboarding-header-copy">
                  <p class="profile-onboarding-kicker">One more step!</p>
                  <p class="profile-onboarding-intro">Share a bit more about yourself to make the most of GovInsider.</p>
                </div>
                <button class="profile-onboarding-close" type="button" data-profile-close aria-label="Close onboarding"><img src="assets/figma-onboarding-close.svg" alt=""></button>
              </div>
              ${renderProgress()}
              <h2 class="profile-onboarding-title serif">${esc(step.title)}</h2>
              <div class="profile-onboarding-content">
                ${isName ? `<div class="profile-onboarding-name-fields"><input type="text" data-profile-first placeholder="First name" value="${esc(state.profile.firstName)}" autocomplete="given-name"><input type="text" data-profile-last placeholder="Last name" value="${esc(state.profile.lastName)}" autocomplete="family-name"></div>` : `<div class="profile-onboarding-options">${step.options.map((option) => {
                  const selected = state.profile[step.key] === option;
                  return `<button class="profile-onboarding-option" type="button" data-profile-option="${esc(option)}" aria-pressed="${selected}"><span>${esc(option)}</span>${selected ? '<img src="assets/figma-role-selected.svg" alt="">' : ""}</button>`;
                }).join("")}</div>`}
                ${isName ? "" : '<p class="profile-onboarding-note"><img src="assets/figma-onboarding-info.svg" alt="">We gather this info to make your experience more personal and enjoyable.</p>'}
              </div>
              <button class="profile-onboarding-next" type="button" data-profile-next ${canAdvance(step) ? "" : "disabled"}>${stepIndex === steps.length - 1 ? "Complete" : "Next"}</button>`;
            overlay.querySelector("[data-profile-close]").addEventListener("click", close);
            const next = overlay.querySelector("[data-profile-next]");
            overlay.querySelectorAll("[data-profile-option]").forEach((button) => button.addEventListener("click", () => {
              state.profile[step.key] = button.dataset.profileOption;
              render();
            }));
            overlay.querySelectorAll("[data-profile-first], [data-profile-last]").forEach((input) => input.addEventListener("input", () => {
              state.profile.firstName = overlay.querySelector("[data-profile-first]").value;
              state.profile.lastName = overlay.querySelector("[data-profile-last]").value;
              next.disabled = !canAdvance(step);
            }));
            next.addEventListener("click", () => {
              if (!canAdvance(step)) return;
              if (stepIndex === steps.length - 1) { close(); return; }
              stepIndex += 1;
              render();
            });
            if (isName) overlay.querySelector("[data-profile-first]").focus();
          };
          render();
        }

        function showModeChangeHint(mode) {
          showCenterHint(tr(`${mode}Changed`));
        }

        function showBookmarkHint() {
          showCenterHint(tr("bookmarked"), "bookmark");
        }

        return { activate, getState: () => state, showSwipeHint, showLoginHint, showPersonalisedHint, showTopicSetup, showRoleSetup, showCloseOnboarding, showWelcome: () => setWelcomeVisible(true) };
      }

        const screenRegistration = document.getElementById("screen-registration");
        const screenAuthChoice = document.getElementById("screen-auth-choice");

        const screenAuthSignup = document.getElementById("screen-auth-signup");

        let readerTab = "latest";
        let welcomeShown = false;
        let isAuthenticated = !VISITOR_FLOW;
        let pendingAction = null;
        let authReturnScreen = "reader";
        let authLoginFromHome = false;

        function showScreen(name, hint) {
          [screenHome, screenReader, screenRegistration, screenAuthChoice, screenAuthLogin, screenAuthSignup].forEach((s) => s.classList.remove("active"));
          if (name === "home") screenHome.classList.add("active");
          if (name === "reader") { screenReader.classList.add("active"); reader1.activate(); if (hint) reader1.showSwipeHint(); }
          if (name === "registration") screenRegistration.classList.add("active");
          if (name === "auth-choice") screenAuthChoice.classList.add("active");
          if (name === "auth-login") screenAuthLogin.classList.add("active");
          if (name === "auth-signup") screenAuthSignup.classList.add("active");
        }

        function requireLogin(action) {
          pendingAction = action;
          authReturnScreen = screenHome.classList.contains("active") ? "home" : "reader";
          screenAuthChoice.querySelector(".auth-title").textContent = action.type === "bookmark" ? "Found something worth saving?" : "Make your daily catch-up more relevant";
          showScreen("auth-choice");
        }

        function showHomeWelcome() {
          renderHome();
          showScreen("home");
          const overlay = document.createElement("section");
          overlay.className = "home-welcome-overlay";
          overlay.innerHTML = `
            <div class="home-welcome-sheet" role="dialog" aria-modal="true" aria-labelledby="home-welcome-title">
              <button class="home-welcome-close" type="button" data-welcome-close aria-label="Close welcome"><img src="assets/figma-onboarding-close.svg" alt=""></button>
              <p class="home-welcome-wave" aria-hidden="true">👋</p>
              <h2 id="home-welcome-title" class="serif">Welcome to GovInsider</h2>
              <p>Stay up to date with the latest insights, stories, and events shaping government and the public sector across Asia.</p>
              <button type="button" data-welcome-tour>Show me around</button>
            </div>`;
          screenHome.appendChild(overlay);
          setTimeout(() => overlay.classList.add("show"), 900);
          const close = () => { overlay.classList.remove("show"); setTimeout(() => overlay.remove(), 350); };
          overlay.querySelector("[data-welcome-close]").addEventListener("click", close);
          overlay.querySelector("[data-welcome-tour]").addEventListener("click", close);
        }

        function showRegistrationComplete() {
          const features = [
            ["Key takeaways", "Insights for you, in every story."],
            ["Quick digest", "Get 3x more value from your reading time."],
            ["Personalised content", "Skip the scroll. See content tailored to you."],
            ["Bookmarks", "Skip the scroll. See content tailored to you."],
          ];
          screenRegistration.innerHTML = `
            <main class="registration-complete">
              <img class="registration-logo" src="${ASSETS.logoPng}" alt="GovInsider">
              <div><p class="registration-eyebrow">Registration complete</p><h1 class="registration-title serif">Great news! You have unlocked exclusive features.</h1></div>
              <section class="registration-features">${features.map(([title, copy]) => `<div class="registration-feature"><img src="assets/figma-onboarding-complete.svg" alt=""><div><strong>${title}</strong><span>${copy}</span></div></div>`).join("")}</section>
              <p class="registration-copy">Want more personalised content? Tell us a little about your professional context.</p>
              <div class="registration-actions"><button type="button" data-personalise>Personalise my experience</button><button type="button" data-later>Later</button></div>
            </main>`;
          screenRegistration.querySelector("[data-personalise]").addEventListener("click", () => {
            showScreen("reader");
            reader1.showCloseOnboarding(showHomeWelcome);
          });
          screenRegistration.querySelector("[data-later]").addEventListener("click", showHomeWelcome);
          showScreen("registration");
        }

        function completeLogin(isSignUp = false) {
          isAuthenticated = true;
          if (pendingAction && pendingAction.type === "bookmark") {
            reader1.getState().bookmarked.add(pendingAction.postId);
          }
          if (pendingAction && pendingAction.type === "like") {
            reader1.getState().likedPosts.add(pendingAction.postId);
          }
          const category = pendingAction && pendingAction.type === "category" ? pendingAction.value : null;
          readerTab = category === "curated" ? "curated" : "latest";
          if (category) {
            const readerState = reader1.getState();
            readerState.storyGroup = category === "curated" || category === "topics" ? null : category;
            readerState.selectedTopics = [];
            readerState.topicSelectionGroup = null;
            readerState.surpriseActive = false;
            readerState.latestIndex = 0;
            readerState.curatedIndex = 0;
          }
          pendingAction = null;
          welcomeShown = true;
          renderHome();
          showScreen("reader");
          const showCategorySetup = category === "curated"
            ? () => reader1.showTopicSetup(showRegistrationComplete)
            : category === "peopleLikeYou"
              ? () => reader1.showRoleSetup("peers", showRegistrationComplete)
              : category === "sector"
                ? () => reader1.showRoleSetup("sector", showRegistrationComplete)
                : category === "industry"
                  ? () => reader1.showRoleSetup("industry", showRegistrationComplete)
                  : null;
          if (showCategorySetup) {
            reader1.showLoginHint();
            setTimeout(showCategorySetup, 1400);
          }
          else if (isSignUp) reader1.showLoginHint();
        }

        screenAuthChoice.innerHTML = `
          <button class="auth-back" type="button" data-auth-back><img src="${ASSETS.authChevron}" alt=""><span>Back</span></button>
          <div class="auth-content">
            <h1 class="auth-title serif">Make your daily catch-up more relevant</h1>
            <p class="auth-copy">Create an account to customise what you see and keep your preferences.</p>
            <button class="auth-provider" type="button" data-auth-complete><img class="auth-provider-mark" src="${ASSETS.authGoogle}" alt="">Continue with Google</button>
            <button class="auth-provider" type="button" data-auth-complete><img class="auth-provider-mark" src="${ASSETS.authLinkedin}" alt="">Continue with Linkedin</button>
            <button class="auth-provider" type="button" data-show-signup><img class="auth-provider-mark" src="${ASSETS.authEmail}" alt="">Continue with email</button>
            <p class="auth-legal">By continuing, you agree to<br>GovInsider’s <a href="https://govinsider.asia/privacy-policy" target="_blank" rel="noopener">Privacy Policy</a></p>
            <p class="auth-account-prompt">Already have an account?</p>
            <button class="auth-primary" type="button" data-show-login>Login</button>
          </div>`;

        screenAuthLogin.innerHTML = `
          <button class="auth-back" type="button" data-auth-login-back><img src="${ASSETS.authChevron}" alt=""><span>Back</span></button>
          <div class="auth-content">
            <h1 class="auth-title serif">Welcome back!</h1>
            <button class="auth-provider auth-login-action" type="button"><img class="auth-provider-mark" src="${ASSETS.authGoogle}" alt="">Login with Google</button>
            <button class="auth-provider auth-login-action" type="button"><img class="auth-provider-mark" src="${ASSETS.authLinkedin}" alt="">Login with Linkedin</button>
            <div class="auth-divider"><span>or</span></div>
            <div class="auth-field">
              <label for="visitor-email">Email</label>
              <div class="auth-input-wrap"><input id="visitor-email" type="email" autocomplete="email" placeholder="Your email"></div>
            </div>
            <div class="auth-field">
              <label for="visitor-password">Password</label>
              <div class="auth-input-wrap"><input id="visitor-password" type="password" autocomplete="current-password" placeholder="Your password"><button class="auth-show-password" type="button" data-toggle-password aria-label="Show password">Show</button></div>
            </div>
            <button class="auth-forgot" type="button">Forgot password</button>
            <button class="auth-primary auth-login-action" type="button">Login</button>
            <p class="auth-signup-link">Don't have an account?<button type="button" data-auth-choice>Sign up</button></p>
          </div>`;

        screenAuthSignup.innerHTML = `
          <button class="auth-back" type="button" data-auth-signup-back><img src="assets/figma-signup-chevron.svg" alt=""><span>Back</span></button>
          <form class="auth-signup-form" data-email-signup>
            <div class="auth-field"><label for="signup-email"><span class="auth-required">*</span> Email</label><div class="auth-input-wrap"><input id="signup-email" type="email" autocomplete="email" placeholder="Your email"></div></div>
            <div class="auth-field"><label for="signup-password"><span class="auth-required">*</span> Password <img class="auth-info" src="assets/figma-signup-info.svg" alt="Password requirements"></label><div class="auth-input-wrap"><input id="signup-password" type="password" autocomplete="new-password" placeholder="Your password"></div></div>
            <div class="auth-field"><label for="signup-password-confirm"><span class="auth-required">*</span> Confirm password</label><div class="auth-input-wrap"><input id="signup-password-confirm" type="password" autocomplete="new-password" placeholder="Type your password again"></div></div>
            <div class="auth-consents">
              <label class="auth-check"><input type="checkbox" checked><span>I want to subscribe to GovInsider Bulletin for the latest updates on public sector innovation</span></label>
              <label class="auth-check"><input type="checkbox" checked><span>I confirm that I have read and agree to the <a href="https://govinsider.asia/privacy-policy" target="_blank" rel="noopener">Privacy Policy</a></span></label>
              <label class="auth-check"><input type="checkbox" checked><span>I confirm that the contact information I have given is for the purpose of Business Communications</span></label>
            </div>
            <button class="auth-primary" type="submit">Sign up</button>
            <p class="auth-signup-note">*If I have provided a non-business domain email address (such as, but not limited to, gmail, hotmail, etc) I am doing so in the context of it being used for my business and not personal interactions with GovInsider.</p>
          </form>`;

        screenAuthChoice.querySelector("[data-auth-back]").addEventListener("click", () => showScreen(authReturnScreen));
        screenAuthChoice.querySelectorAll("[data-show-login]").forEach((button) => button.addEventListener("click", () => { authLoginFromHome = false; showScreen("auth-login"); }));
        screenAuthChoice.querySelector("[data-show-signup]").addEventListener("click", () => showScreen("auth-signup"));
        screenAuthChoice.querySelectorAll("[data-auth-complete]").forEach((button) => button.addEventListener("click", () => completeLogin(true)));
        screenAuthLogin.querySelectorAll("[data-auth-choice]").forEach((button) => button.addEventListener("click", () => showScreen("auth-choice")));
        screenAuthLogin.querySelector("[data-auth-login-back]").addEventListener("click", () => showScreen(authLoginFromHome ? authReturnScreen : "auth-choice"));
        screenAuthLogin.querySelectorAll(".auth-login-action").forEach((button) => button.addEventListener("click", () => completeLogin()));
        screenAuthLogin.querySelector("[data-toggle-password]").addEventListener("click", (event) => {
          const input = screenAuthLogin.querySelector("#visitor-password");
          const reveal = input.type === "password";
          input.type = reveal ? "text" : "password";
          event.currentTarget.textContent = reveal ? "Hide" : "Show";
          event.currentTarget.setAttribute("aria-label", reveal ? "Hide password" : "Show password");
        });
        screenAuthSignup.querySelector("[data-auth-signup-back]").addEventListener("click", () => showScreen("auth-choice"));
        screenAuthSignup.querySelector("[data-email-signup]").addEventListener("submit", (event) => { event.preventDefault(); completeLogin(true); });

        // ---- Home page render ----
        function renderHome() {
        const homeAccountAction = isAuthenticated ? `
          <button class="bookmark-badge-wrap" type="button" aria-label="Saved articles">
            <img src="${ASSETS.iconBookmarkFull}" width="20" height="20" alt="Saved">
            <div class="bookmark-badge"><span>0</span></div>
          </button>
          <div class="user-icon-wrap">
            <img src="${ASSETS.iconUser}" width="20" height="20" alt="Account">
            <div class="user-dot"></div>
          </div>` : '<button class="home-login" type="button" data-home-login>Login</button>';
        const homeContent = isAuthenticated ? `
          <div class="curated-section">
            <div class="curated-heading">
              <div class="curated-heading-row"><p class="serif">Curated for You</p></div>
              <div class="curated-heading-rule"></div>
            </div>
            <div class="curated-cards hide-scrollbar">
              ${CURATED_HOME_CARDS.map((card) => `
                <div class="curated-card">
                  <div class="curated-card-img">
                    <img src="${ASSETS.articleJpg}" alt="${esc(card.title)}" loading="lazy" decoding="async" draggable="false">
                    <button class="curated-card-bm"><img src="${ASSETS.iconBookmark}" width="16" height="16" alt="Bookmark"></button>
                  </div>
                  <div class="curated-card-body">
                    <div class="curated-card-tags">${card.tags.map((t) => `<span>${esc(t)}</span>`).join("")}</div>
                    <p class="curated-card-title serif">${esc(card.title)}</p>
                    <p class="curated-card-excerpt">${esc(card.excerpt)}</p>
                  </div>
                  <button class="curated-card-more"><img src="${ASSETS.iconStar}" width="16" height="16" alt=""><span>More like this</span></button>
                </div>`).join("")}
            </div>
            <div class="qd-cta-stack">
              <button class="qd-cta-main" data-open-reader="curated">
                <div class="txt"><p>Quick Digest</p><p>Catch up with curated articles in minutes.</p></div>
                <img src="${ASSETS.iconArrowBig}" alt="">
              </button>
              <div class="qd-shadow1"></div><div class="qd-shadow2"></div>
            </div>
          </div>` : `
          <section class="headlines-section" aria-labelledby="headlines-title">
            <div class="headlines-heading"><h2 id="headlines-title" class="serif">Headlines</h2><span class="headlines-rule"></span></div>
            <article class="headline-feature">
              <img src="${ASSETS.visitorHeadlineFeature}" alt="People looking at a living map" loading="lazy" decoding="async">
              <p class="headline-tag">Healthcare</p>
              <h3 class="headline-title">Behind the ‘living map’ delivering preventive healthcare with geospatial tech</h3>
              <p class="headline-partner">Partner</p>
            </article>
            <article class="headline-list-item">
              <img src="${ASSETS.visitorHeadlineSecondary}" alt="Digital economy illustration" loading="lazy" decoding="async">
              <div><p class="headline-tag">Artificial Intelligence</p><h3 class="headline-title">Indonesia’s digital economy strategy to close gap for AI infrastructure, says economic planner</h3></div>
            </article>
          </section>`;
        screenHome.innerHTML = `
      <div class="home-nav">
        <div class="home-nav-row">
          <button class="icon-btn"><img src="${ASSETS.iconMenu}" width="20" height="20" alt="Menu"></button>
          <div class="home-logo-wrap"><img src="${ASSETS.logoPng}" alt="GovInsider" draggable="false"></div>
          <button class="icon-btn"><img src="${ASSETS.iconSearch}" width="20" height="20" alt="Search"></button>
          ${homeAccountAction}
        </div>
        <div class="subnav hide-scrollbar">
          <div class="subnav-inner">
            <button class="subnav-item">Articles</button>
            <button class="subnav-item">Videos</button>
            <button class="subnav-item">Events</button>
            <button class="subnav-topics"><span>Topics</span><img src="${ASSETS.iconArrowSmall}" width="8" height="8" alt=""></button>
            <button class="quick-digest-pill" data-open-reader="latest">
              <img src="${ASSETS.iconGroup}" alt="">
              <span>Quick Digest</span>
            </button>
            <div class="subnav-divider-item"><button><img src="${ASSETS.iconSocialShare}" width="20" height="20" alt="Share"><img src="${ASSETS.iconArrowSmall}" width="8" height="8" alt=""></button></div>
            <div class="subnav-divider-item"><button><img src="${ASSETS.iconTranslate}" width="20" height="20" alt="Translate"><img src="${ASSETS.iconArrowSmall}" width="8" height="8" alt=""></button></div>
          </div>
        </div>
      </div>

      <div class="home-banner-wrap">
        <div class="img-wrap"><img src="${isAuthenticated ? ASSETS.bannerJpg : ASSETS.visitorBanner}" alt="Banner" decoding="async" fetchpriority="high" draggable="false"></div>
        <div class="carousel-dots">
          <div class="dot active"></div><div class="dot"></div><div class="dot"></div>
        </div>
      </div>

      ${homeContent}
    `;

        screenHome.querySelectorAll("[data-open-reader]").forEach((btn) => {
          btn.addEventListener("click", () => {
            readerTab = btn.getAttribute("data-open-reader");
            if (readerTab !== "latest" && !isAuthenticated) {
              requireLogin({ type: "category", value: readerTab });
              return;
            }
            reader1.getState().latestIndex = 0;
            reader1.getState().curatedIndex = 0;
            showScreen("reader", welcomeShown);
            if (!welcomeShown) {
              welcomeShown = true;
              reader1.showWelcome();
            }
          });
        });

        screenHome.querySelector("[data-home-login]")?.addEventListener("click", () => {
          authReturnScreen = "home";
          authLoginFromHome = true;
          showScreen("auth-login");
        });
        screenHome.querySelector(".bookmark-badge-wrap")?.addEventListener("click", () => {
          if (!isAuthenticated) requireLogin({ type: "bookmark-list" });
        });
        screenHome.querySelectorAll(".curated-card-bm").forEach((button) => button.addEventListener("click", () => {
          if (!isAuthenticated) requireLogin({ type: "bookmark", postId: ALL_LATEST[0].id });
        }));
        }

        const reader1 = createReader({
          screenEl: screenReader,
          initialTabGetter: () => readerTab,
          onClose: () => VISITOR_FLOW && isAuthenticated ? reader1.showCloseOnboarding(showHomeWelcome) : showScreen("home"),
          canAccess: () => isAuthenticated,
          onRequireLogin: requireLogin,
        });

        renderHome();

        showScreen("home");
      });
    })();

  </script>
</body>

</html>
