<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Fast Read — Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap">
  <link rel="preload" as="image" href="assets/728d61dd7c89.jpg" fetchpriority="high">
  <style>
    /* ===================== Fonts ===================== */
    @font-face {
      font-family: 'Gotham Narrow';
      font-style: normal;
      font-weight: 325;
      src: url(assets/9ce8a43d0392.woff2) format('woff2');
      font-display: swap;
    }

    @font-face {
      font-family: 'Gotham Narrow';
      font-style: italic;
      font-weight: 325;
      src: url(assets/d254f1d1afc2.woff2) format('woff2');
      font-display: swap;
    }

    @font-face {
      font-family: 'Gotham Narrow';
      font-style: normal;
      font-weight: 350;
      src: url(assets/9be2dc185bf3.woff2) format('woff2');
      font-display: swap;
    }

    @font-face {
      font-family: 'Gotham Narrow';
      font-style: normal;
      font-weight: 700;
      src: url(assets/41496b1622d5.woff2) format('woff2');
      font-display: swap;
    }

    :root {
      --purple: #94409C;
      --teal: #0bbcb1;
      --teal-dark: #09a096;
      --ink: #232323;
      --border: #dbdbdb;
      --border2: #e8e8e8;
      --grey-bg: #f0f0f0;
      --grey-bg2: #f5f5f5;
      --sky-blue-100: #e6f2fb;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: 'Gotham Narrow', system-ui, sans-serif;
      font-weight: 325;
      background: #f0f0f0;
      color: var(--ink);
      overflow: hidden;
    }

    button {
      font-family: inherit;
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      cursor: pointer;
      color: inherit;
    }

    img {
      -webkit-user-drag: none;
      user-select: none;
    }

    ul {
      margin: 0;
    }

    .serif {
      font-family: 'Playfair Display', Georgia, serif;
    }

    .hide-scrollbar {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* App shell: emulate a phone viewport centered on desktop */
    #app-shell {
      width: 100%;
      height: 100dvh;
      max-width: 430px;
      margin: 0 auto;
      position: relative;
      background: #fff;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.15);
    }

    @media (min-width:431px) {
      body {
        background: #d8d8d8;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
      background: #fff;
    }

    .screen.active {
      display: flex;
    }

    .screen.showing-ad {
      background: #f5f5f5;
    }

    /* Quick Digest welcome */
    .welcome-overlay {
      position: absolute;
      inset: 0;
      z-index: 70;
      background: #421d46;
      overflow: hidden;
      touch-action: none;
      will-change: transform;
    }

    .welcome-overlay[hidden] {
      display: none;
    }

    .welcome-overlay:focus {
      outline: none;
    }

    .welcome-overlay .welcome-content {
      min-height: 100%;
      padding-top: 48px;
      padding-bottom: 96px;
    }

    .welcome-close {
      position: absolute;
      right: 0;
      top: 2px;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      background: var(--ink);
      z-index: 1;
    }

    .welcome-close img {
      width: 14px;
      height: 14px;
    }

    .welcome-content {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #421d46;
      color: #fff;
      padding: 24px clamp(20px, 10vw, 44px);
      touch-action: pinch-zoom;
    }

    .welcome-heading {
      text-align: center;
      margin-bottom: 44px;
    }

    .welcome-mark {
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #53245a;
      margin: 0 auto 6px;
    }

    .welcome-mark img {
      width: 37px;
      height: 37px;
    }

    .welcome-eyebrow {
      font-size: 14px;
      letter-spacing: 1.5px;
      font-weight: 400;
      margin: 0 0 8px;
    }

    .welcome-title {
      font-size: 34px;
      line-height: 1.2;
      margin: 0;
      font-weight: 700;
    }

    .welcome-subtitle {
      text-align: center;
      font-size: 20px;
      line-height: 1.3;
      font-weight: 700;
      color: #e0bee3;
      margin: 0 0 22px;
    }

    .welcome-choices {
      display: flex;
      flex-direction: column;
      gap: 17px;
    }

    .welcome-choice {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 20px;
      text-align: left;
      padding: 13px 23px;
      min-height: 74px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: #faf1fb;
      color: var(--ink);
      position: relative;
    }

    .reading-icon-box {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 4px;
      background: #fff;
      color: var(--purple);
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
      flex-shrink: 0;
    }

    .welcome-choice strong {
      display: block;
      font-size: 18px;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .welcome-choice span span {
      display: block;
      font-size: 16px;
      line-height: 1.2;
      color: #4b4b4b;
    }

    .welcome-choice[aria-pressed="true"] {
      background: #64d1cc;
      border-color: var(--teal-dark);
      padding-right: 54px;
    }

    .welcome-choice[aria-pressed="true"] .reading-icon-box {
      color: var(--ink);
    }

    .welcome-choice[aria-pressed="true"]::after {
      content: "✓";
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      display: grid;
      place-items: center;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: var(--teal-dark);
      color: #fff;
      font-size: 25px;
    }

    .welcome-choice:hover {
      border-color: var(--teal-dark);
    }

    .welcome-enter {
      width: 100%;
      margin-top: 44px;
      padding: 16px;
      background: var(--purple);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      border-radius: 0;
    }

    .welcome-enter:hover {
      background: #a34bab;
    }

    .welcome-enter:focus-visible,
    .welcome-choice:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 4px;
    }

    .post-body {
      display: flex;
      flex-direction: column;
    }

    .post-tags {
      order: 1;
    }

    .post-title {
      order: 2;
    }

    .post-takeaway {
      order: 3;
    }

    .post-bullets {
      order: 4;
    }

    .screen[data-reading-mode="hurry"] .post-bullets {
      display: none;
    }

    .screen[data-reading-mode="quick"] .post-bullets li:nth-child(n + 3) {
      display: none;
    }

    @media (max-height:750px) {
      .welcome-content {
        padding-top: 16px;
        padding-bottom: 16px;
      }

      .welcome-heading {
        margin-bottom: 22px;
      }

      .welcome-choices {
        gap: 12px;
      }

      .welcome-mark {
        width: 48px;
        height: 48px;
      }

      .welcome-subtitle {
        margin-bottom: 16px;
      }
    }

    /* ===================== Home Page ===================== */
    #screen-home {
      overflow-y: auto;
    }

    .home-nav {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #fff;
    }

    .home-nav-row {
      display: flex;
      align-items: center;
      width: 100%;
      border-bottom: 1px solid var(--border);
    }

    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      flex-shrink: 0;
    }

    .home-logo-wrap {
      flex: 1;
      min-width: 0;
      padding: 0 8px;
      display: flex;
      align-items: center;
    }

    .home-logo-wrap img {
      width: 113px;
      height: 30px;
      object-fit: contain;
      pointer-events: none;
    }

    .bookmark-badge-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 52px;
      height: 37px;
    }

    .bookmark-badge {
      position: absolute;
      top: 6px;
      left: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 0 4px;
      min-width: 16px;
      height: 16px;
      background: #f7e7f9;
      border: 1px solid #e6c7e9;
    }

    .bookmark-badge span {
      font-size: 10px;
      line-height: 1;
      color: #7e3685;
    }

    .user-icon-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      flex-shrink: 0;
    }

    .user-dot {
      position: absolute;
      top: 16px;
      left: 32px;
      border-radius: 999px;
      width: 8px;
      height: 8px;
      background: #f5222d;
    }

    .home-login {
      flex: 0 0 auto;
      min-height: 48px;
      margin: 8px 16px 8px 4px;
      padding: 8px 12px;
      border-radius: 1px;
      background: var(--purple);
      box-shadow: 0 2px 0 rgba(0, 0, 0, .05);
      color: #fff;
      font-size: 14px;
      font-weight: 350;
      letter-spacing: .28px;
      line-height: 21px;
    }

    .subnav {
      display: flex;
      align-items: center;
      overflow-x: auto;
      overflow-y: hidden;
      background: #fff;
      padding-left: 16px;
      height: 44px;
      border-bottom: 1px solid var(--border);
      border-top: 1px solid var(--border);
      touch-action: pan-x;
    }

    .subnav-inner {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-shrink: 0;
      padding-right: 8px;
    }

    .subnav-item {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 0;
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.24px;
      color: var(--ink);
      white-space: nowrap;
    }

    .subnav-topics {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px 0;
      flex-shrink: 0;
    }

    .subnav-topics span {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.24px;
      color: var(--ink);
      white-space: nowrap;
    }

    .quick-digest-pill {
      display: flex;
      align-items: center;
      gap: 2px;
      border-radius: 8px;
      padding: 4px;
      flex-shrink: 0;
      background: #faf0fb;
    }

    .quick-digest-pill img {
      width: 16px;
      height: 16px;
      object-fit: contain;
    }

    .quick-digest-pill span {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.24px;
      white-space: nowrap;
      color: #94409c;
    }

    .subnav-divider-item {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      border-left: 1px solid var(--border);
    }

    .subnav-divider-item button {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px;
    }

    .home-banner-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding-bottom: 24px;
      width: 100%;
    }

    .home-banner-wrap .img-wrap {
      width: 100%;
      overflow: hidden;
    }

    .home-banner-wrap img {
      width: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .carousel-dots {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .carousel-dots .dot {
      border-radius: 999px;
      width: 4.5px;
      height: 4.5px;
      background: #e3e3e3;
    }

    .carousel-dots .dot.active {
      width: 13.5px;
      background: #0bbcb1;
    }

    .curated-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      padding: 40px 0;
      width: 100%;
      background: #03302d;
    }

    .curated-heading {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      width: 100%;
      padding: 0 16px;
    }

    .curated-heading-row {
      display: flex;
      align-items: center;
      width: 100%;
    }

    .curated-heading-row p {
      flex: 1;
      line-height: 37px;
      font-size: 28px;
      color: #fff;
      font-weight: 500;
      margin: 0;
    }

    .curated-heading-rule {
      width: 100%;
      height: 1px;
      background: #09a096;
      opacity: 0.4;
    }

    .curated-cards {
      display: flex;
      gap: 16px;
      width: 100%;
      overflow-x: auto;
      padding-bottom: 4px;
      padding-left: 16px;
    }

    .curated-card {
      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: flex-start;
      flex-shrink: 0;
      position: relative;
      width: 280px;
    }

    .curated-card:last-child {
      padding-right: 16px;
    }

    .curated-card-img {
      width: 100%;
      overflow: hidden;
      position: relative;
      aspect-ratio: 320/180;
    }

    .curated-card-img img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .curated-card-bm {
      position: absolute;
      top: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border-radius: 2px;
      background: #fff;
      border: 1px solid var(--border);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.02);
    }

    .curated-card-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-start;
      width: 100%;
    }

    .curated-card-tags {
      display: flex;
      gap: 8px;
      align-items: center;
      width: 100%;
      overflow: hidden;
    }

    .curated-card-tags span {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.24px;
      white-space: nowrap;
      color: #09a096;
    }

    .curated-card-title {
      line-height: 32px;
      font-size: 24px;
      color: #fff;
      width: 100%;
      font-weight: 500;
      margin: 0;
    }

    .curated-card-excerpt {
      line-height: 18px;
      font-size: 15px;
      color: #fff;
      opacity: 0.7;
      width: 100%;
      overflow: hidden;
      margin: 0;
    }

    .curated-card-more {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      border-radius: 2px;
      background: #fff;
      border: 1px solid var(--border);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.05);
    }

    .curated-card-more span {
      font-size: 14px;
      letter-spacing: 0.28px;
      color: var(--ink);
      font-weight: 325;
      white-space: nowrap;
    }

    .headlines-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 40px 16px;
      background: #fff;
    }

    .headlines-heading {
      display: flex;
      align-items: end;
      gap: 8px;
    }

    .headlines-heading h2 {
      margin: 0;
      color: #454545;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -1.4px;
      line-height: 37px;
    }

    .headlines-rule {
      flex: 1;
      height: 9px;
      margin-bottom: 4px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .headline-feature,
    .headline-list-item {
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }

    .headline-feature { display: grid; gap: 8px; }
    .headline-feature img { width: 100%; aspect-ratio: 358 / 240; object-fit: cover; }
    .headline-tag {
      margin: 0;
      color: var(--teal-dark);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .24px;
      line-height: 18px;
      text-transform: uppercase;
    }
    .headline-title {
      margin: 0;
      color: var(--ink);
      font-size: 16px;
      font-weight: 700;
      line-height: 24px;
    }
    .headline-partner {
      width: max-content;
      margin: 4px 0 0;
      padding: 2px 8px;
      border: 1px solid #f7e7f9;
      background: #f5f5f5;
      color: var(--purple);
      font-size: 12px;
      font-weight: 325;
      letter-spacing: .24px;
      line-height: 18px;
      text-transform: uppercase;
    }
    .headline-list-item { display: flex; gap: 12px; }
    .headline-list-item img { width: 112px; height: 112px; object-fit: cover; }
    .headline-list-item > div { display: grid; align-content: start; gap: 4px; }

    .qd-cta-stack {
      position: relative;
      width: 100%;
      padding: 0 16px;
    }

    .qd-cta-main {
      display: flex;
      gap: 16px;
      align-items: center;
      overflow: hidden;
      padding: 12px;
      border-radius: 4px;
      width: 100%;
      text-align: left;
      background: #08857e;
      border: 1px solid #09a096;
      position: relative;
      z-index: 3;
      margin-bottom: -68px;
    }

    .qd-cta-main .txt {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      align-items: flex-start;
      justify-content: center;
      color: #fff;
    }

    .qd-cta-main .txt p:first-child {
      font-weight: 700;
      line-height: 27px;
      font-size: 18px;
      letter-spacing: 0.36px;
      margin: 0;
    }

    .qd-cta-main .txt p:last-child {
      line-height: 21px;
      font-size: 14px;
      letter-spacing: 0.28px;
      font-weight: 325;
      margin: 0;
    }

    .qd-cta-main img {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
    }

    .qd-shadow1 {
      border-radius: 4px;
      width: 100%;
      background: #066b65;
      height: 72px;
      margin-bottom: -68px;
      position: relative;
      z-index: 2;
    }

    .qd-shadow2 {
      border-radius: 4px;
      width: 100%;
      background: #055550;
      height: 72px;
      position: relative;
      z-index: 1;
    }

    /* ===================== Reader screens ===================== */
    .reader-tabbar {
      position: absolute;
      top: 0;
      right: 0;
      z-index: 20;
      width: 40px;
      height: 40px;
      pointer-events: none;
    }

    .reader-close-btn {
      position: absolute;
      top: 0;
      right: 0;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #232323;
      border-radius: 0;
      pointer-events: auto;
    }

    .reader-close-btn img {
      width: 14px;
      height: 14px;
    }

    .reader-tour-trigger {
      position: absolute;
      top: 48px;
      right: 6px;
      z-index: 20;
      width: 28px;
      height: 28px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: #fff;
      color: var(--purple);
      font-size: 17px;
      font-weight: 700;
      line-height: 1;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
    }

    .reader-tour {
      position: absolute;
      inset: 0;
      z-index: 80;
      background: rgba(0, 0, 0, 0.58);
    }

    .reader-tour-open .reader-tour-trigger {
      display: none;
    }

    .reader-tour-open .reader-tabbar,
    .reader-tour-open .reader-bottombar {
      pointer-events: none;
    }

    .reader-tour-open[data-tour-step="1"] .reader-bottombar,
    .reader-tour-open[data-tour-step="2"] .reader-bottombar {
      position: relative;
      z-index: auto;
    }

    .reader-tour-open[data-tour-step="1"] .reader-bottombar::before {
      content: "";
      position: absolute;
      top: 8px;
      right: 92px;
      bottom: 8px;
      left: 12px;
      z-index: 81;
      background: #fff;
    }

    .reader-tour-open[data-tour-step="2"] .bottombar-icons {
      position: relative;
      z-index: auto;
    }

    .reader-tour-open[data-tour-step="2"] .bottombar-icons::after {
      content: "";
      position: absolute;
      top: -14px;
      right: -8px;
      bottom: -14px;
      z-index: 81;
      width: 82px;
      background: #fff;
    }

    .reader-tour-open[data-tour-step="1"] .bottombar-left,
    .reader-tour-open[data-tour-step="1"] [data-language-settings],
    .reader-tour-open[data-tour-step="1"] [data-reading-settings],
    .reader-tour-open[data-tour-step="2"] [data-bookmark],
    .reader-tour-open[data-tour-step="2"] [data-share] {
      position: relative;
      z-index: 82;
    }

    .reader-tour[hidden],
    .reader-tour-step[hidden] {
      display: none;
    }

    .reader-tour-card {
      position: absolute;
      z-index: 1;
      box-sizing: border-box;
      padding: 14px 18px;
      border-radius: 6px;
      background: #eafafa;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.35;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }

    .reader-tour-card strong {
      font-weight: 700;
    }

    .reader-tour-card p {
      margin: 0;
    }

    .reader-tour-card p+p {
      margin-top: 12px;
    }

    .reader-tour-toolbar-card {
      bottom: 112px;
      left: 18%;
      width: 74%;
      border-bottom-left-radius: 0;
    }

    .reader-tour-toolbar-card::after {
      content: "";
      position: absolute;
      bottom: -24px;
      left: 0;
      border-top: 25px solid #eafafa;
      border-right: 38px solid transparent;
    }

    .reader-tour-bookmark-card {
      top: 106px;
      left: 25%;
      width: 64%;
      border-bottom-left-radius: 0;
    }

    .reader-tour-bookmark-card::before {
      content: "";
      position: absolute;
      bottom: -24px;
      left: 0;
      border-top: 25px solid #eafafa;
      border-right: 38px solid transparent;
    }

    .reader-tour-bookmark-action {
      bottom: 84px;
      left: 26%;
      width: 67%;
      border-bottom-right-radius: 0;
    }

    .reader-tour-bookmark-action::after {
      content: "";
      position: absolute;
      right: 25px;
      bottom: -24px;
      border-top: 25px solid #eafafa;
      border-left: 38px solid transparent;
    }

    .reader-tour-action {
      width: 100%;
      margin-top: 12px;
      padding: 8px 12px;
      background: var(--purple);
      color: #fff;
      font: inherit;
      font-weight: 700;
      line-height: 1;
    }

    .swipe-hint {
      position: absolute;
      left: 50%;
      top: auto;
      bottom: 96px;
      transform: translate(-50%, 16px) scale(0.92);
      z-index: 60;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(35, 35, 35, 0.88);
      backdrop-filter: blur(2px);
      color: #fff;
      padding: 16px 26px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 350;
      letter-spacing: 0.2px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity .22s ease .08s, transform .22s ease .08s;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    }

    .swipe-hint.show {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    .swipe-hint.login-success {
      left: 13%;
      width: 74%;
      justify-content: center;
      gap: 16px;
      padding: 24px 28px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 350;
      line-height: 1.45;
      white-space: pre-line;
      text-align: left;
      transform: translate(0, 16px) scale(0.92);
    }

    .swipe-hint.login-success.show {
      transform: translate(0, 0) scale(1);
    }

    .swipe-hint-login-icon {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
    }

    .swipe-hint-arrow {
      font-size: 22px;
      display: inline-block;
      line-height: 1;
    }

    .swipe-hint-arrow.up {
      animation: swipeHintUp 1s ease-in-out infinite;
    }

    .swipe-hint-arrow.side {
      animation: swipeHintSide 1s ease-in-out infinite;
    }

    .swipe-hint-bookmark {
      width: 24px;
      height: 24px;
      filter: brightness(0) invert(1);
    }

    @keyframes swipeHintUp {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    @keyframes swipeHintSide {

      0%,
      100% {
        transform: translateX(0);
      }

      50% {
        transform: translateX(4px);
      }
    }

    .tabslide-host {
      flex: 1;
      display: flex;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }

    .tabslide-clip {
      flex: 1;
      overflow: hidden;
      position: relative;
      min-height: 0;
    }

    .tabslide-tape {
      position: absolute;
      inset: 0;
      display: flex;
      width: 200%;
      will-change: transform;
    }

    .tabslide-pane {
      flex: 1;
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    /* Each slide owns its background during transitions from the welcome page. */
    .vfeed-item {
      background: #fff;
    }

    /* Vertical feed (option 1) */
    .vfeed-clip {
      touch-action: pinch-zoom;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
    }

    .vfeed-tape {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      will-change: transform;
    }

    .vfeed-item {
      height: 100%;
      touch-action: pinch-zoom;
    }

    .vfeed-item.scrollable {
      overflow-y: auto;
    }

    .vfeed-dots {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
      z-index: 10;
    }

    .vfeed-dots .dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #e8e8e8;
      transition: background-color .2s;
    }

    .vfeed-dots .dot.active {
      background: var(--purple);
    }

    .vfeed-dots {
      display: none;
    }

    /* Post / Ad content */
    .post-content {
      padding-bottom: 40px;
    }

    .post-cover {
      width: calc(100% - 40px);
      margin: 20px 20px 0;
      background: #e5e7eb;
      aspect-ratio: 200/112;
      overflow: hidden;
    }

    .post-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .post-body {
      padding: 16px 20px 0;
    }

    .post-tags {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .post-tags span {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      line-height: 18px;
    }

    .post-title {
      font-size: 20px;
      font-weight: 700;
      line-height: 28px;
      color: #000;
      margin: 0 0 16px;
    }

    .post-bullets {
      margin: 0 0 24px;
      padding-left: 20px;
      list-style: disc outside;
    }

    .post-bullets li {
      font-size: 16px;
      line-height: 24px;
      letter-spacing: 0.02em;
      color: var(--ink);
      margin-bottom: 12px;
    }

    .post-bullets li:last-child {
      margin-bottom: 0;
    }

    .post-takeaway {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 0 0 12px;
      padding: 12px;
      border: 1px solid #dedede;
      border-radius: 4px;
      background: #fff;
    }

    .post-takeaway img {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      margin-top: 1px;
      filter: brightness(0) saturate(100%) invert(31%) sepia(32%) saturate(1684%) hue-rotate(247deg) brightness(89%) contrast(89%);
    }

    .post-takeaway p {
      margin: 0;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      color: var(--ink);
    }

    .post-takeaway strong {
      color: var(--purple);
      font-weight: 700;
    }

    .ad-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      gap: 16px;
      background: #f5f5f5;
    }

    .ad-content .ad-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      line-height: 18px;
      color: #8b8b8b;
      font-weight: 325;
    }

    .ad-content .ad-img-wrap {
      width: 100%;
      padding: 0 40px;
    }

    .ad-content img {
      width: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .event-slide {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      justify-content: center;
      padding: 24px;
      background: #f7f7f7;
      overflow: hidden;
    }

    .event-card {
      width: 100%;
      max-width: 540px;
      box-sizing: border-box;
      padding: 20px;
      border: 1px solid #a9e0e4;
      border-radius: 5px;
      background: #eaf8f9;
    }

    .event-media {
      width: 100%;
      aspect-ratio: 16/9;
      overflow: hidden;
      background: #cfe0ee;
      flex-shrink: 0;
    }

    .event-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .event-live-badge {
      display: flex;
      align-items: center;
      gap: 24px;
      margin: 0 0 32px;
      background: #f5222d;
      color: #fff;
      padding: 4px 10px;
      font-weight: 700;
      font-size: 16px;
      line-height: 24px;
      flex-shrink: 0;
    }

    .event-live-badge .dot {
      position: relative;
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #fff;
      display: inline-block;
      z-index: 0;
    }

    .event-live-badge .dot::after {
      content: "";
      position: absolute;
      inset: -5px;
      border: 2px solid rgba(255, 255, 255, .7);
      border-radius: inherit;
      animation: eventWave 1.4s ease-out infinite;
    }

    @keyframes eventWave {
      from {
        transform: scale(.5);
        opacity: 1;
      }

      to {
        transform: scale(1.4);
        opacity: 0;
      }
    }

    .event-info {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 12px 0 0;
    }

    .event-title {
      font-weight: 700;
      font-size: 25px;
      line-height: 1.26;
      letter-spacing: 0.2px;
      color: #232323;
      margin: 0 0 2px;
      text-align: left;
    }

    .event-meta-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 16px;
      line-height: 1.45;
      letter-spacing: 0.32px;
      color: #232323;
      font-weight: 325;
    }

    .event-meta-row svg {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      margin-top: 2px;
      filter: invert(44%) sepia(84%) saturate(692%) hue-rotate(132deg) brightness(91%) contrast(93%);
    }

    .event-meta-copy {
      min-width: 0;
    }

    .event-date-copy {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .event-meta-row .sep {
      color: var(--teal-dark);
    }

    .event-meta-row .tz {
      color: #232323;
    }

    .event-register-btn {
      width: 100%;
      min-height: 48px;
      margin-top: 6px;
      background: var(--purple);
      color: #fff;
      border-radius: 1px;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.05);
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.28px;
    }

    .event-register-btn:active {
      background: #7e3685;
    }

    .event-later-btn {
      width: 100%;
      min-height: 48px;
      background: #fff;
      color: #232323;
      border: 1px solid #dbdbdb;
      border-radius: 1px;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.05);
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.28px;
    }

    .event-later-btn:active {
      background: #f5f5f5;
    }

    @media (max-height: 700px) {
      .event-card {
        padding: 16px;
      }

      .event-info {
        gap: 13px;
      }

      .event-title {
        font-size: 22px;
      }

    @media (prefers-reduced-motion: reduce) {
      .event-live-badge .dot::after {
        animation: none;
        opacity: 0;
      }
    }

    .summary-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      min-height: 100%;
      box-sizing: border-box;
      position: relative;
      gap: 0;
      background: #f5f5f5;
      padding: 40px clamp(40px, 14vw, 60px) 32px;
      text-align: center;
    }

    .showing-summary .reader-tour-trigger {
      display: none;
    }

    .summary-streak {
      display: none;
      position: absolute;
      top: 0;
      left: 16px;
      right: 16px;
      z-index: 2;
      width: auto;
      margin: 0;
      padding: 12px 12px 13px;
      border-radius: 14px;
      background: rgba(35, 35, 35, .91);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff;
      box-shadow: 0 12px 22px rgba(35, 35, 35, .16);
      opacity: 0;
      transform: translateY(-12px);
      pointer-events: none;
    }

    .summary-streak.show {
      display: block;
      animation: summary-streak-in .28s ease-out forwards;
    }

    @keyframes summary-streak-in {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .summary-streak-days {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      padding: 0 22px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, .22);
    }

    .summary-streak-day {
      display: grid;
      gap: 4px;
      min-width: 20px;
      color: rgba(255, 255, 255, .9);
      font-size: 11px;
      font-weight: 700;
    }

    .summary-streak-day.complete {
      color: var(--teal);
    }

    .summary-streak-mark {
      display: grid;
      place-items: center;
      width: 20px;
      height: 20px;
      border: 1px solid currentColor;
      border-radius: 50%;
      font-size: 12px;
      line-height: 1;
    }

    .summary-streak-day.complete .summary-streak-mark {
      border-color: var(--teal-dark);
      background: var(--teal-dark);
      color: #fff;
    }

    .summary-streak-title,
    .summary-streak-copy {
      margin: 0;
      color: #fff;
    }

    .summary-streak-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
    }

    .summary-streak-copy {
      margin-top: 3px;
      font-size: 13px;
      line-height: 1.3;
    }

    .summary-title {
      max-width: 330px;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 20px;
      font-weight: 700;
      color: #000;
      line-height: 1.18;
      margin: 0;
    }

    .summary-covered-topics {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 24px;
      margin-top: 10px;
    }

    .summary-covered-topics[data-collapsed="true"] {
      max-height: 40px;
      overflow: hidden;
    }

    .summary-covered-topics span {
      color: var(--teal-dark);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .7px;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .summary-covered-more {
      margin-top: 8px;
      padding: 0;
      color: #8b8b8b;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .2px;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-transform: uppercase;
    }

    .summary-sub {
      font-size: 16px;
      line-height: 1.3;
      color: #606060;
      margin: 28px 0 26px;
      max-width: 320px;
      font-weight: 325;
    }

    .summary-sub span {
      display: block;
    }

    .summary-sub span+span {
      margin-top: 8px;
    }

    .summary-topics-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      margin: 0;
    }

    .summary-topic-card {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      background: #fff;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 10px 16px;
      min-height: 44px;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(20, 20, 20, 0.02);
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }

    .summary-topic-card:active {
      transform: scale(0.98);
      background: #fafafa;
    }

    .summary-topic-card .topic-hash {
      color: #c9c9c9;
      font-size: 22px;
      font-weight: 325;
      line-height: 1;
      flex-shrink: 0;
    }

    .summary-topic-card .tag {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.1px;
      color: #232323;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .summary-topic-card .topic-check {
      display: grid;
      place-items: center;
      width: 20px;
      height: 20px;
      border: 1px solid #d9d9d9;
      border-radius: 50%;
      flex-shrink: 0;
      color: transparent;
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
    }

    .summary-topic-card.is-selected {
      border-color: var(--purple);
      background: #fff;
    }

    .summary-topic-card.is-selected .topic-check {
      border-color: var(--teal-dark);
      background: var(--teal-dark);
      color: #fff;
    }

    .summary-continue-btn {
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;
      border-radius: 1px;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.05);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .2px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .summary-continue-btn {
      margin-top: 24px;
      background: var(--purple);
      color: #fff;
    }

    .summary-continue-btn:disabled {
      opacity: .48;
      cursor: not-allowed;
    }

    .summary-home-btn {
      width: auto;
      margin-top: 28px;
      padding: 0;
      color: #232323;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
    }

    .summary-continue-btn:not(:disabled):active,
    .summary-home-btn:active {
      transform: scale(.98);
    }

    @media (prefers-reduced-motion: reduce) {
      .summary-streak.show {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }

    /* Bottom bar */
    .reader-bottombar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border-top: 1px solid #f0f0f0;
      box-shadow: 0 -6px 16px rgba(35, 35, 35, 0.08);
      height: 72px;
      padding: 0 20px;
      z-index: 10;

      border-top-color: transparent;
      box-shadow: none;
    }

    .reader-bottombar.event-only {
      justify-content: center;
    }

    .reader-bottombar.event-only .bottombar-left,
    .reader-bottombar.event-only .bottombar-icons> :not([data-share]) {
      display: none;
    }

    .reader-likebar {
      position: absolute;
      right: 0;
      bottom: 72px;
      left: 0;
      z-index: 11;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      height: 40px;
      padding: 0 20px;
      background: #fff;
      color: var(--ink);
      border-top: 1px solid #e8e8e8;
      font-size: 14px;
      font-weight: 360;
      pointer-events: none;
      visibility: hidden;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .2s ease, transform .2s ease, visibility .2s;
    }

    .reader-likebar.show {
      pointer-events: auto;
      visibility: visible;
      opacity: 1;
      transform: translateY(0);
    }

    .reader-like-action {
      display: none;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 0;
      color: #595959;
      font-size: 12px;
      font-weight: 360;
    }

    .reader-like-action.show {
      display: flex;
    }

    .reader-like-action svg {
      width: 20px;
      height: 20px;
      color: var(--ink);
      fill: currentColor;
      stroke: none;
    }

    .reader-like-action .like-filled {
      display: none;
    }

    .reader-like-action[aria-pressed="true"] {
      color: var(--purple);
    }

    .reader-like-action[aria-pressed="true"] svg {
      color: var(--purple);
      fill: currentColor;
    }

    .reader-like-action[aria-pressed="true"] .like-outline {
      display: none;
    }

    .reader-like-action[aria-pressed="true"] .like-filled {
      display: block;
    }

    .reader-fullarticle {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
      padding: 0;
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .28px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .reader-fullarticle-label {
      padding-bottom: 2px;
      border-bottom: 1px solid #b6b6b6;
    }

    .reader-fullarticle-arrow {
      font-size: 16px;
      font-weight: 325;
      line-height: 1;
    }

    .bottombar-left {
      flex: 1;
      min-width: 0;

        { id: 5, tags: [{ l: "Guest Column", c: TEAL }], title: "The era of 'geotechnology'", bullets: ["Calum Handforth argues that technology has become inseparable from geopolitics, and national leaders — not just tech ministries — now need to own that agenda.", "He frames three priorities for governments: sovereignty over their tech trajectory, a clear strategy for what technology should do for them, and resilience against being shaped entirely by outside players.", "The piece warns against both digital isolationism and total openness, calling instead for countries to chart their own path within a connected global system."], image: ASSETS.thumb4, url: "https://govinsider.asia/intl-en/article/the-era-of-geotechnology" },
        { id: 6, tags: [{ l: "Artificial Intelligence", c: TEAL }, { l: "Healthcare", c: TEAL }], title: "Singapore's public healthcare workers can now build their own AI agents", bullets: ["Synapxe's new Agentsea platform lets healthcare staff build their own AI agents through plain-language prompts, no coding required.", "More than 12,000 agents have been created since June, covering tasks like clinical record summaries, procurement reviews and roster generation.", "The platform screens out sensitive data like IDs and financial details before it can be used to build an agent, and flags risky requests automatically."], image: ASSETS.thumb5, url: "https://govinsider.asia/intl-en/article/singapores-public-healthcare-workers-can-now-build-their-own-ai-agents" },
        { id: 7, tags: [{ l: "DigiGovSpotlight", c: TEAL }, { l: "Digital Government", c: TEAL }], title: "Building invisibility into digital public services", bullets: ["Digital Hungary Agency's Zsolt Bányai wants public services to feel as effortless as flipping a light switch, with more than 4,500 digitised services rebuilt around real citizen research.", "The agency's DÁP app now has 1.9 million registrations and issues free, EU-valid digital signatures at a scale the country's old paper-based system never reached.", "Hungary is now digitising full life events — like selling a used car entirely from a phone — and preparing a certified EU Digital Identity Wallet."], image: ASSETS.thumb6, url: "https://govinsider.asia/intl-en/article/building-invisibility-into-digital-public-services" },
        { id: 8, tags: [{ l: "Artificial Intelligence", c: TEAL }, { l: "Guest Column", c: TEAL }], title: "If your AI risk register says 'human review', send it back", bullets: ["Karl Hopkins argues that \u201chuman review\u201d is often listed as an AI safeguard without specifying what the reviewer can actually see, verify or control.", "Recent court cases show reviewers missing hidden instructions, fabricated signatures and last-minute swaps between the version they checked and the one that was actually used.", "He calls for risk registers to spell out exactly what a reviewer is checking, rather than treating the phrase as a safeguard on its own."], image: ASSETS.thumb7, url: "https://govinsider.asia/intl-en/article/if-your-ai-risk-register-says-human-review-send-it-back" },
        { id: 9, tags: [{ l: "Smart Cities", c: TEAL }, { l: "Transport", c: TEAL }], title: "Better data can build more connected cities", bullets: ["At DTI-CX 2026 in Jakarta, government and industry speakers agreed that accurate, shared spatial data is now the foundation for planning fast-growing cities like Jabodetabek.", "Indonesia's Ministry of Transport is pushing a \u201csingle source of truth\u201d for transport data, while Jakarta uses AI-driven traffic control to ease congestion across buses, MRT and LRT.", "Logistics leaders want government and industry data shared more openly, arguing delivery and GPS data could sharpen urban planning if it were pooled."], image: ASSETS.thumb8, url: "https://govinsider.asia/intl-en/article/better-data-can-build-more-connected-cities" },
      ];

      const ALL_CURATED = [
        { id: 10, tags: [{ l: "Artificial Intelligence", c: TEAL }, { l: "Guest Column", c: TEAL }], title: "We must begin to protect the skills that make us human", bullets: ["Yeo Yong Kiat warns that leaning on AI shortcuts risks eroding the judgment, curiosity and debate skills people build by doing the work themselves.", "As more people use the same AI tools trained on the same data, he expects answers — and thinking — to converge, leaving less room for disagreement and originality.", "His proposed fix is structural: organisations should build warm-up periods and protected tasks into workflows so core human skills don't quietly disappear."], image: ASSETS.thumb9, url: "https://govinsider.asia/intl-en/article/we-must-begin-to-protect-the-skills-that-make-us-human" },
        { id: 11, tags: [{ l: "Data", c: TEAL }, { l: "Guest Column", c: TEAL }], title: "How Ukraine is building a real-time data system to regulate its gambling market", bullets: ["Ukraine's new State Online Gambling Monitoring System, built by Kitsoft for regulator PlayCity, replaces fragmented manual reporting with live transactional data.", "Designed to process up to 100,000 transactions a second, it already covers 28 of 31 licensed operators and anonymises player data using hashed identifiers.", "A second stage will extend monitoring into in-game results and equipment, plus new portals for the finance ministry and central bank."], image: ASSETS.thumb10, url: "https://govinsider.asia/intl-en/article/how-ukraine-is-building-a-real-time-data-system-to-regulate-its-gambling-market" },
        { id: 12, tags: [{ l: "Cross-border Innovation", c: TEAL }, { l: "Digital Economy", c: TEAL }], title: "Talent, culture and IP: spotlighting Sarawak's creative economy", bullets: ["Creative professionals at BAGFEST 2026 pointed to Sarawak's undocumented folklore and traditions as an untapped source of original intellectual property.", "Panellists said local talent often has to look outside the state for opportunities, and called for closer links between studios and universities to keep skills at home.", "Government grants are already helping local studios pitch Bornean-inspired concepts to international clients, including a grant-backed trailer blending live action and virtual production."], image: ASSETS.thumb11, url: "https://govinsider.asia/intl-en/article/talent-culture-and-ip-spotlighting-sarawaks-creative-economy" },
        { id: 13, tags: [{ l: "Digital Government", c: TEAL }, { l: "GovProfiles", c: TEAL }], title: "An engineer as civil servant", bullets: ["Open Government Products director Li Hongyi runs his Singapore government team like a start-up, having shipped more than 40 products including Parking.sg and core Covid-19 systems.", "He argues big, one-shot national IT projects are risky bets, and pushes instead for small, cheap experiments that scale only once they've proven to work.", "As OGP has grown toward 200 staff, Li's challenge has shifted from proving the model works to replicating it across smaller, semi-autonomous teams."], image: ASSETS.thumb12, url: "https://govinsider.asia/intl-en/article/an-engineer-as-civil-servant" },
        { id: 14, tags: [{ l: "Digital Public Infrastructure", c: TEAL }, { l: "GovInsights", c: TEAL }], title: "Indonesia's digital social protection programme as a real DPI test before it hosts the world", bullets: ["Indonesia is rolling out its digital social protection programme (Perlinsos) nationwide from October 2026, ahead of hosting the Global DPI Summit in Bali in 2027.", "A Banyuwangi pilot cut beneficiary verification time from months to hours by having agencies share data instead of asking citizens to prove their identity repeatedly.", "The rollout is also a test of public trust under Indonesia's new data protection law, and of reaching the roughly 500 districts where internet access still varies widely."], image: ASSETS.thumb13, url: "https://govinsider.asia/intl-en/article/indonesias-digital-social-protection-programme-as-a-real-dpi-test-before-it-hosts-the-world" },
        { id: 15, tags: [{ l: "Guest Column", c: TEAL }], title: "How to turn a country into a technology magnet", bullets: ["Urkhan Seyidov argues tax breaks and special economic zones no longer decide where tech companies set up — countries need to function like platforms instead.", "He frames the calculation as perceived value minus cost of entry plus government support, meaning governments should cut friction and uncertainty as much as offer incentives.", "The strongest move is subsidising the wider network — talent, universities, suppliers — rather than individual companies, so each new investor becomes easier to attract than the last."], image: ASSETS.thumb14, url: "https://govinsider.asia/intl-en/article/how-to-turn-a-country-into-a-technology-magnet" },
      ];

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function pickRecommendedTopics(saved, count) {
        const valid = topicsWithLatestArticles();
        const favorites = saved.filter((topic) => valid.has(topic)).slice(0, Math.min(3, count));
        const candidates = new Set();
        saved.forEach((t) => (TOPIC_RELATIONS[t] || []).forEach((rt) => { if (saved.indexOf(rt) === -1 && valid.has(rt)) candidates.add(rt); }));
        let pool = shuffle(Array.from(candidates));
        const relatedCount = Math.max(0, count - favorites.length);
        if (pool.length < relatedCount) {
          const rest = shuffle(Array.from(valid).filter((t) => saved.indexOf(t) === -1 && pool.indexOf(t) === -1));
          pool = pool.concat(rest);
        }
        return favorites.concat(pool.slice(0, Math.min(2, relatedCount)));
      }

      const STREAK_STORAGE_KEY = "quick-digest-streak";

      function localDayKey(date = new Date()) {
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${date.getFullYear()}-${month}-${day}`;
      }

      function nextStreak(record, today = localDayKey()) {
        if (!record || !record.day || !record.count) return { day: today, count: 1 };
        if (record.day === today) return record;
        const yesterday = new Date(`${today}T00:00:00`);
        yesterday.setDate(yesterday.getDate() - 1);
        return record.day === localDayKey(yesterday)
          ? { day: today, count: record.count + 1 }
          : { day: today, count: 1 };
      }

      function recordSummaryVisit() {
        const today = localDayKey();
        try {
          const stored = JSON.parse(localStorage.getItem(STREAK_STORAGE_KEY) || "null");
          const streak = nextStreak(stored, today);
          streak.count = Math.max(5, streak.count);
          localStorage.setItem(STREAK_STORAGE_KEY, JSON.stringify(streak));
          return streak;
        } catch (err) {
          return { day: today, count: 5 };
        }
      }

      function streakDayStrip(streakCount = 1) {
        const firstCount = Math.max(1, streakCount - 3);
        return Array.from({ length: 5 }, (_, i) => {
          const count = firstCount + i;
          return `<span class="summary-streak-day" data-streak-count="${count}"><span class="summary-streak-mark"></span><span>${count}</span></span>`;
        }).join("");
      }

      // ---------------------------------------------------------
      // Generic drag helper (pointer events, mouse + touch)
      // ---------------------------------------------------------
      function onPointerDrag(el, handlers) {
        let dragging = false;
        let sx = 0, sy = 0, pid = null;
        el.addEventListener("pointerdown", (e) => {
          if (handlers.shouldStart && !handlers.shouldStart(e)) return;
          dragging = true; sx = e.clientX; sy = e.clientY; pid = e.pointerId;
          try { el.setPointerCapture(pid); } catch (err) { }
          handlers.onStart && handlers.onStart(e);
        });
        el.addEventListener("pointermove", (e) => {
          if (!dragging || e.pointerId !== pid) return;
          handlers.onMove && handlers.onMove(e.clientX - sx, e.clientY - sy, e);
        });
        const end = (e) => {
          if (!dragging || e.pointerId !== pid) return;
          dragging = false;
          try { el.releasePointerCapture(pid); } catch (err) { }
          handlers.onEnd && handlers.onEnd(e.type === "pointercancel" ? 0 : e.clientX - sx, e.type === "pointercancel" ? 0 : e.clientY - sy, e);
        };
        el.addEventListener("pointerup", end);
        el.addEventListener("pointercancel", end);
      }

      // ---------------------------------------------------------
      // Vertical post feed (Option 1): vertical swipe between posts,
      // horizontal drag switches tabs.
      // ---------------------------------------------------------
      function createVFeed(container, opts) {
        // opts: { getPosts(), getIndex(), setIndex(cb) }
        const clip = document.createElement("div");
        clip.className = "vfeed-clip";
        const tape = document.createElement("div");
        tape.className = "vfeed-tape";
        clip.appendChild(tape);
        const dots = document.createElement("div");
        dots.className = "vfeed-dots";
        clip.appendChild(dots);
        container.appendChild(clip);

        let itemEls = [];
        let scrollEls = [];
        let mode = "idle"; // idle | scroll | slide-v | slide-h
        let slideDir = 0;
        let startScrollTop = 0;
        let touchSlideDy = 0;
        let busy = false;

        function getH() { return clip.clientHeight || 1; }

        function setTape(y, animated) {
          tape.style.transition = animated ? "transform 0.38s cubic-bezier(0.32,0,0.15,1)" : "none";
          tape.style.transform = `translateY(${y}px)`;
        }

        function snap(idx, animated) { setTape(-idx * getH(), !!animated); }

        function render() {
          const posts = opts.getPosts();
          tape.innerHTML = "";
          itemEls = []; scrollEls = [];
          const h = getH();
          posts.forEach((item) => {
            const it = document.createElement("div");
            it.className = "vfeed-item" + (item.kind === "ad" || item.kind === "event" ? "" : " scrollable hide-scrollbar");
            it.style.height = h + "px";
            it.innerHTML = renderFeedItem(item, opts.getReadingMode && opts.getReadingMode());
            tape.appendChild(it);
            itemEls.push(it);
            scrollEls.push(item.kind === "ad" || item.kind === "event" ? null : it);
          });
          renderDots();
          snap(opts.getIndex());
        }

        function renderDots() {
          const posts = opts.getPosts();
          const postDots = [];
          posts.forEach((item, i) => { if (item.kind === "post" || item.kind === "event") postDots.push(i); });
          const idx = opts.getIndex();
          let active = postDots.indexOf(idx);
          if (active === -1) {
            // Ads and summaries keep the nearest preceding post or event dot lit.
            for (let i = postDots.length - 1; i >= 0; i--) { if (postDots[i] < idx) { active = i; break; } }
            if (active === -1) active = 0;
          }
          dots.innerHTML = postDots.map((_, i) => `<div class="dot${i === active ? " active" : ""}"></div>`).join("");
        }

        function resetScroll(idx) { const el = scrollEls[idx]; if (el) el.scrollTop = 0; }
        function isAdAt(idx) { const posts = opts.getPosts(); return posts[idx] && (posts[idx].kind === "ad" || posts[idx].kind === "event"); }

        onPointerDrag(clip, {
          shouldStart(e) {
            return !(e.target.closest && e.target.closest("button, a"));
          },
          onStart() {
            mode = "idle"; slideDir = 0; touchSlideDy = 0;
            startScrollTop = scrollEls[opts.getIndex()]?.scrollTop || 0;
          },
          onMove(dx, dy, e) {
            if (busy) return;
            const idx = opts.getIndex();
            const posts = opts.getPosts();
            // Scroll article content first, then use movement beyond its edge to change posts.
            if (e.pointerType === "touch" && mode !== "slide-h") {
              if (mode === "idle" && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) >= 6) {
                mode = "slide-h"; return;
              }
              const scroll = scrollEls[idx];
              const maxScroll = scroll ? Math.max(0, scroll.scrollHeight - scroll.clientHeight) : 0;
              const nextScroll = Math.max(0, Math.min(maxScroll, startScrollTop - dy));
              if (scroll) scroll.scrollTop = nextScroll;
              touchSlideDy = dy - (startScrollTop - nextScroll);
              dy = touchSlideDy;
              if (Math.abs(dy) < 6) {
                mode = "scroll";
                setTape(-idx * getH(), false);
                return;
              }
              if (mode === "scroll") mode = "idle";
            }
            if (mode === "slide-v") {
              e.preventDefault && e.preventDefault();
              const T = 100, sign = dy < 0 ? -1 : 1, abs = Math.abs(dy);
              setTape(-idx * getH() + sign * (abs < T ? abs * 0.25 : T * 0.25 + (abs - T) * 0.55), false);
              return;
            }
            if (mode === "slide-h") { return; }
            if (mode === "scroll") return;
            if (Math.abs(dy) < 6 && Math.abs(dx) < 6) return;
            if (Math.abs(dx) > Math.abs(dy)) { mode = "slide-h"; return; }

            const scroll = scrollEls[idx];
            const st = scroll ? scroll.scrollTop : 0;
            const sm = scroll ? scroll.scrollHeight - scroll.clientHeight : 0;
            const atTop = isAdAt(idx) || st <= 1;
            const atBottom = isAdAt(idx) || sm <= 1 || st >= sm - 1;

            if (dy > 0 && atTop && idx > 0) {
              mode = "slide-v"; slideDir = -1;
              const T = 100, abs = Math.abs(dy);
              setTape(-idx * getH() + (abs < T ? abs * 0.25 : T * 0.25 + (abs - T) * 0.55), false);
            } else if (dy < 0 && atBottom && idx < posts.length - 1) {
              mode = "slide-v"; slideDir = 1;
              const T = 100, abs = Math.abs(dy);
              setTape(-idx * getH() - (abs < T ? abs * 0.25 : T * 0.25 + (abs - T) * 0.55), false);
            } else { mode = "scroll"; }
          },
          onEnd(dx, dy, e) {
            if (e.pointerType === "touch" && e.type !== "pointercancel") dy = touchSlideDy;
            if (busy) { mode = "idle"; return; }
            const idx = opts.getIndex();
            if (mode === "slide-h") { mode = "idle"; return; }
            if (mode === "slide-v") {
              const T = 100;
              if (dy < -T && slideDir === 1) {
                busy = true; const next = idx + 1; setTape(-next * getH(), true);
                setTimeout(() => { opts.setIndex(next); resetScroll(next); renderDots(); busy = false; }, 380);
              } else if (dy > T && slideDir === -1) {
                busy = true; const prev = idx - 1; setTape(-prev * getH(), true);
                setTimeout(() => { opts.setIndex(prev); renderDots(); busy = false; }, 380);
              } else { setTape(-idx * getH(), true); }
            }
            mode = "idle";
          },
        });

        // wheel support (desktop)
        let wAccum = 0, wTimer = null;
        clip.addEventListener("wheel", (e) => {
          if (busy) return;
          const idx = opts.getIndex();
          const posts = opts.getPosts();
          const scroll = scrollEls[idx];
          const st = scroll ? scroll.scrollTop : 0;
          const sm = scroll ? scroll.scrollHeight - scroll.clientHeight : 0;
          const atTop = isAdAt(idx) || st <= 1;
          const atBottom = isAdAt(idx) || sm <= 1 || st >= sm - 1;
          const gd = e.deltaY > 0, gu = e.deltaY < 0;
          if ((gd && atBottom && idx < posts.length - 1) || (gu && atTop && idx > 0)) {
            e.preventDefault();
            if ((gd && wAccum < 0) || (gu && wAccum > 0)) wAccum = 0;
            wAccum += e.deltaY;
            if (wTimer) clearTimeout(wTimer);
            wTimer = setTimeout(() => { wAccum = 0; }, 600);
            if (Math.abs(wAccum) >= 220) {
              wAccum = 0; if (wTimer) clearTimeout(wTimer); busy = true;
              if (gd) { const next = idx + 1; setTape(-next * getH(), true); setTimeout(() => { opts.setIndex(next); resetScroll(next); renderDots(); busy = false; }, 400); }
              else { const prev = idx - 1; setTape(-prev * getH(), true); setTimeout(() => { opts.setIndex(prev); renderDots(); busy = false; }, 400); }
            }
          }
        }, { passive: false });

        window.addEventListener("resize", () => {
          const h = getH();
          itemEls.forEach((it) => { it.style.height = h + "px"; });
          snap(opts.getIndex());
        });

        return {
          render,
          snapCurrent(animated) { snap(opts.getIndex(), animated); renderDots(); },
          resetScroll,
        };
      }

      // ---------------------------------------------------------
      // Tab slider wrapper — hosts two panes (latest/curated),
      // supports either drag-based (v1) or programmatic (v2) switching.
      // ---------------------------------------------------------
      function createTabSlider(container, { dragEnabled }) {
        const clip = document.createElement("div");
        clip.className = "tabslide-clip";
        const tape = document.createElement("div");
        tape.className = "tabslide-tape";
        const paneLatest = document.createElement("div");
        paneLatest.className = "tabslide-pane";
        const paneCurated = document.createElement("div");
        paneCurated.className = "tabslide-pane";
        tape.appendChild(paneLatest);
        tape.appendChild(paneCurated);
        clip.appendChild(tape);
        container.appendChild(clip);

        let activeTab = "latest";
        let busy = false;

        function getW() { return clip.clientWidth || 1; }
        function setX(x, animated) {
          tape.style.transition = animated ? "transform 0.38s cubic-bezier(0.32,0,0.15,1)" : "none";
          tape.style.transform = `translateX(${x}px)`;
        }
        function snap(tab, animated) { setX(tab === "latest" ? 0 : -getW(), animated); activeTab = tab; }

        window.addEventListener("resize", () => { if (!busy) snap(activeTab, false); });

        return {
          paneLatest, paneCurated,
          setActive(tab, animated) { snap(tab, animated !== false); },
          dragTo(x) { if (!busy) setX(x, false); },
          commit(tab, animated, cb) {
            busy = true; setX(tab === "latest" ? 0 : -getW(), animated);
            setTimeout(() => { activeTab = tab; busy = false; cb && cb(); }, animated ? 400 : 0);
          },
          cancel() { snap(activeTab, true); },
          getWidth: getW,
          isBusy: () => busy,
        };
      }

            suggestionsPanel.hidden = suggestedTopics.length === 0;
            content.innerHTML = `<div class="ts-pills">${state.savedTopics.map((t) => {
              const selected = !pendingExplore && pendingTopics.includes(t);
              return `<button class="ts-pill${selected ? " active" : ""}" data-topic="${esc(t)}" aria-pressed="${selected}"><span>${esc(topicLabel(t))}</span><svg class="ts-pill-check" viewBox="0 0 12 10" aria-hidden="true"><path d="m1 5 3 3 7-7"/></svg></button>`;
            }).join("")}</div>${favoriteSelectionChanged ? '<button type="button" class="ts-confirm" data-confirm-read>OK</button>' : ""}`;
            suggestionsContent.innerHTML = `<div class="ts-pills">${suggestedTopics.map((t) => {
              const selected = pendingExplore && pendingTopics.includes(t);
              return `<button class="ts-pill${selected ? " active" : ""}" data-topic="${esc(t)}" aria-pressed="${selected}"><span>${esc(topicLabel(t))}</span><svg class="ts-pill-check" viewBox="0 0 12 10" aria-hidden="true"><path d="m1 5 3 3 7-7"/></svg></button>`;
            }).join("")}</div>${exploreSelectionChanged ? '<button type="button" class="ts-confirm" data-confirm-explore>OK</button>' : ""}`;
            overlay.querySelectorAll("[data-topic]").forEach((btn) => {
              btn.addEventListener("click", () => {
                const explore = suggestionsContent.contains(btn);
                if (pendingExplore !== explore) pendingTopics = [];
                pendingExplore = explore;
                const t = btn.getAttribute("data-topic");
                const i = pendingTopics.indexOf(t);
                if (i >= 0) pendingTopics.splice(i, 1);
                else pendingTopics.push(t);
                surpriseSelected = false;
                renderContent();
              });
            });
            function confirmSelection(explore) {
              state.selectedTopics = pendingTopics.slice();
              cbs.onSelectTopics(state.selectedTopics, explore);
              close();
            }
            const readConfirm = content.querySelector("[data-confirm-read]");
            if (readConfirm) readConfirm.addEventListener("click", () => confirmSelection(false));
            const exploreConfirm = suggestionsContent.querySelector("[data-confirm-explore]");
            if (exploreConfirm) exploreConfirm.addEventListener("click", () => confirmSelection(true));
          } else {
            suggestionsPanel.hidden = true;
            const visible = showAll ? ALL_TOPICS : ALL_TOPICS.slice(0, INITIAL_VISIBLE);
            content.innerHTML = `
          <div class="ts-edit">
            <p class="ts-edit-title">${esc(tr("editFavorites"))}</p>
            <div class="ts-chip-grid">${visible.map((topic) => {
              const checked = editingTopics.includes(topic);
              return `<button class="ts-chip${checked ? " checked" : ""}" data-chip="${esc(topic)}">${esc(topicLabel(topic))}${checked ? `<img src="${ASSETS.iconCheck}" width="12" height="12" alt="">` : ""}</button>`;
            }).join("")}</div>
            ${!showAll ? `<div class="ts-loadmore"><button data-loadmore>${esc(tr("loadMore"))}</button></div>` : ""}
            <div class="ts-actions">
              <button class="ts-cancel" data-cancel>${esc(tr("cancel"))}</button>
              <button class="ts-save" data-save>${esc(tr("save"))}</button>
            </div>
          </div>`;
            content.querySelectorAll("[data-chip]").forEach((btn) => {
              btn.addEventListener("click", () => {
                const t = btn.getAttribute("data-chip");
                const i = editingTopics.indexOf(t);
                if (i >= 0) editingTopics.splice(i, 1); else editingTopics.push(t);
                renderContent();
              });
            });
            const lm = content.querySelector("[data-loadmore]");
            if (lm) lm.addEventListener("click", () => { showAll = true; renderContent(); });
            content.querySelector("[data-cancel]").addEventListener("click", () => { isEditing = false; renderContent(); });
            content.querySelector("[data-save]").addEventListener("click", () => {
              state.savedTopics = editingTopics.slice();
              cbs.onSaveTopics(state.savedTopics);
              pendingTopics = pendingTopics.filter((topic) => state.savedTopics.includes(topic)).concat(pendingTopics.filter((topic) => !state.savedTopics.includes(topic)).slice(0, 2));
              const nextSelectedTopics = state.selectedTopics.filter((topic) => state.savedTopics.includes(topic)).concat(state.selectedTopics.filter((topic) => !state.savedTopics.includes(topic)).slice(0, 2));
              if (nextSelectedTopics.length !== state.selectedTopics.length) {
                state.selectedTopics = nextSelectedTopics;
                cbs.onSelectTopics(state.selectedTopics);
              }
              isEditing = false; renderContent();
            });
          }
        }

        overlay.querySelector("[data-close]").addEventListener("click", close);
        feedTabButtons.forEach((button) => {
          button.addEventListener("click", () => {
            if (cbs.isAccessRestricted && cbs.isAccessRestricted() && button.dataset.feedTab !== "latest") {
              close();
              cbs.onRequireLogin({ type: "category", value: button.dataset.feedTab });
              return;
            }
            cbs.onSelectFeedTab(button.dataset.feedTab);
            close();
          });
        });
        storyGroupButtons.forEach((button) => {
          button.addEventListener("click", () => {
            if (cbs.isAccessRestricted && cbs.isAccessRestricted() && button.dataset.storyGroup !== "topStoriesWeek") {
              close();
              cbs.onRequireLogin({ type: "category", value: button.dataset.storyGroup });
              return;
            }
            cbs.onSelectStoryGroup(button.dataset.storyGroup);
            close();
          });
        });
        overlay.querySelector("[data-edit]").addEventListener("click", () => {
          if (cbs.isAccessRestricted && cbs.isAccessRestricted()) {
            close();
            cbs.onRequireLogin({ type: "category", value: "topics" });
            return;
          }
          isEditing = true;
          renderContent();
        });

        return { open, close };
      }

      // ---------------------------------------------------------
      // Reader (shared state/behaviour for both v1 and v2)

      let summaryStreakShown = false;

      function createReader({ screenEl, initialTabGetter, onClose, canAccess, onRequireLogin }) {
        screenEl.dataset.readingMode = "quick";
        const state = {
          activeTab: "latest",
          storyGroup: null,
          latestIndex: 0,
          curatedIndex: 0,
          surpriseActive: false,
          selectedTopics: [],
          curatedTopics: [],
          moreToExploreTopics: [],
          topicSelectionGroup: null,
          savedTopics: DEFAULT_SAVED_TOPICS.slice(),
          bookmarked: new Set(),
          likedPosts: new Set(),
          likedTopics: [],
          profile: { firstName: "", lastName: "", sector: null, industry: null, jobLevel: null, jobFunction: null },
          summaryRecs: { latest: null, curated: null },
          summarySelections: { latest: [], curated: [] },
          latestPosts: shuffle(ALL_LATEST),
          curatedPosts: shuffle(ALL_CURATED),
          coveredTopicCount: 2,
          coveredTopicLabels: ["Guest Column", "Artificial Intelligence"],
          showAllCoveredTopics: false,
          // Topic cards tapped on the summary slide append their own group of
          // demo posts here (keyed by tab), rendered as normal feed slides
          // before the single summary at the end of the feed.
          extended: { latest: [], curated: [] },
        };

        function shufflePosts() { state.latestPosts = shuffle(ALL_LATEST); state.curatedPosts = shuffle(ALL_CURATED); }
        function filteredLatest() { return state.selectedTopics.length ? state.latestPosts.filter((p) => state.selectedTopics.some((topic) => matchesTopic(p, topic))) : state.latestPosts; }
        function filteredCurated() { return state.curatedPosts; }
        function summaryItem(tab) {
          if (!state.summaryRecs[tab]) {
            state.summaryRecs[tab] = SUMMARY_TOPICS.map((topic) => ({ topic }));
          }
          return {
            kind: "summary",
            tab,
            recs: state.summaryRecs[tab],
            selected: state.summarySelections[tab],
            coveredTopics: state.coveredTopicLabels.length,
            coveredTopicLabels: state.coveredTopicLabels,
            showAllCoveredTopics: state.showAllCoveredTopics,
          };
        }
        function extendedPosts(tab) { return state.extended[tab].reduce((acc, g) => acc.concat(g.items), []); }
        function feedLatest() { return buildFeed(filteredLatest()).concat(extendedPosts("latest")).concat([summaryItem("latest")]); }
        function feedCurated() { return buildFeed(filteredCurated()).concat(extendedPosts("curated")).concat([summaryItem("curated")]); }

        function currentFeed() { return state.activeTab === "latest" ? feedLatest() : feedCurated(); }
        function currentIndex() { return state.activeTab === "latest" ? state.latestIndex : state.curatedIndex; }
        function currentItem() {
          const feed = currentFeed();
          return feed[currentIndex()] || feed[0];
        }
        function currentPost() {
          const item = currentItem();
          return (item && item.kind === "post") ? item : ALL_LATEST[0];
        }

        // ---- DOM scaffold ----
        screenEl.innerHTML = `
      <div class="reader-tabbar">
        <button class="reader-close-btn" data-close><img src="${ASSETS.iconClose}" width="14" height="14" alt="Close"></button>

          <svg class="like-filled" viewBox="0 0 20 20" aria-hidden="true"><path d="M11.808 0.833328L5.83301 6.81666V17.5H16.0913L19.1663 10.3333V6.66666H12.2413L13.1747 2.18333L11.808 0.833328ZM0.833008 7.49999H4.16634V17.5H0.833008V7.49999Z"/></svg>
          <span data-like-label>I like this content</span>
        </button>
        <button class="reader-fullarticle" type="button" data-open-article>
          <span class="reader-fullarticle-label">Full Article</span><span class="reader-fullarticle-arrow" aria-hidden="true">&#8594;</span>
        </button>
      </div>
      <div class="reader-bottombar">
        <div class="bottombar-left"></div>
        <div class="bottombar-icons">
          <button type="button" data-language-settings aria-label="Language settings">${TOOLBAR_TRANSLATE}</button>
          <button type="button" data-reading-settings aria-label="Reading settings"><span class="toolbar-reading-style" data-reading-mode-indicator>1.5x</span></button>

      </div>
