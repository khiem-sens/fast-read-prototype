<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Fast Read Visitor Prototype</title>
    <script>
      const destination = new URL("../index.html?flow=visitor", location.href);
      new URLSearchParams(location.search).forEach((value, key) => destination.searchParams.set(key, value));
      destination.searchParams.set("flow", "visitor");
      destination.hash = location.hash;
      location.replace(destination.href);
    </script>
  </head>
  <body>
    <a href="../index.html?flow=visitor">Open visitor flow</a>
  </body>
</html>
